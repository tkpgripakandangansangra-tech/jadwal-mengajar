  const gab = {};
  [...a.docs, ...b.docs].forEach(d=>{ gab[d.id] = {id:d.id,...d.data()}; });
  IJL = Object.values(gab).sort((x,y)=>((y.DibuatPada?.seconds)||0)-((x.DibuatPada?.seconds)||0));
  const saya = IJL.filter(x=>x.GuruEmail===AKUN.Email);
  const tugas = [];
  IJL.forEach(x=>(x.Sesi||[]).forEach(s=>{ if(s.PenggantiEmail===AKUN.Email) tugas.push({pg:x, s}); }));
  const hariAda = HARI.filter(h=>(perHari[h]||[]).length);
  const thIni = new Date().getFullYear();

async function kirimIjin(){
  const alasan = el('ijAlasan').value.trim();
  if(!alasan){ toast('⚠️ Tulis alasannya'); return; }
  const jenis = IJ_MODE;
  let Sesi = [], Rentang = null;
  if(jenis==='harian'){
    const cek = [...document.querySelectorAll('.ijinCek:checked')];
    if(!cek.length){ toast('⚠️ Centang dulu hari / sesi mengajar yang akan ditinggalkan'); return; }
    Sesi = cek.map(c=>({Hari:c.dataset.hari, NoJP:Number(c.dataset.nojp), Waktu:c.dataset.waktu, NamaMapel:c.dataset.mapel, NamaKelas:c.dataset.kelas, PenggantiEmail:'', PenggantiNama:''}));
  } else {
    if(!IJ_CELLS.length){ toast('⚠️ Anda belum punya jadwal mengajar yang disetujui'); return; }
    Rentang = jenis==='mingguan' ? rentangMingguan() : rentangBulanan();
    if(!Rentang || !Rentang.Mulai){ toast('⚠️ Pilih dulu rentang waktunya'); return; }
    Sesi = IJ_CELLS.map(c=>({Hari:c.Hari, NoJP:Number(c.NoJP), Waktu:c.Waktu||'', NamaMapel:c.NamaMapel||'', NamaKelas:c.NamaKelas||'', PenggantiEmail:'', PenggantiNama:''}));
  }
  const b = el('ijKirim'); b.disabled = true;
  try{
    await addDoc(collection(db,'pengajuan_ijin'), {SekolahId:AKUN.SekolahId, GuruEmail:AKUN.Email, GuruNama:AKUN.NamaPengguna, Alasan:alasan, Sesi, PenggantiEmails:[], Status:'menunggu', DibuatPada:serverTimestamp(), JenisIjin:jenis, Rentang:Rentang||{Mulai:'',Selesai:''}});
    const periode = Rentang ? ` (${ijTglPanjang(Rentang.Mulai)} s.d. ${Rentang.Selesai ? ijTglPanjang(Rentang.Selesai) : 'tanpa batas'})` : ` (${Sesi.length} sesi)`;
    for(const t of [SEKOLAH.EmailKepalaSekolah, SEKOLAH.EmailOperator].filter(Boolean)){
      await addDoc(collection(db,'notifikasi'), {SekolahId:AKUN.SekolahId, TargetEmail:t, Judul:'🌴 Guru mengajukan izin', Isi:`${AKUN.NamaPengguna} mengajukan izin ${jenis}${periode}. Alasan: ${alasan}`, Dibuka:false, DibuatPada:serverTimestamp()});
    }
    toast('📤 Permohonan terkirim ke KS & Operator');
    bukaModul('ijinSaya');
  }catch(err){ toast('⛔ '+teksErr(err)); }
  finally{ b.disabled = false; }
}
async function kartuIjinOp(x, bisa){
  let s = '';
  for(let i=0;i<(x.Sesi||[]).length;i++){
    const ss = x.Sesi[i];
    const lbl = `${esc(ss.Hari)} JP ${ss.NoJP} · ${esc(ss.Waktu||'')} · ${esc(ss.NamaMapel||'')} (${esc(ss.NamaKelas||'')})`;
    if(ss.PenggantiEmail){
      s += `<span class="sesiChip pengganti">✅ ${lbl} → <b>${esc(ss.PenggantiNama||ss.PenggantiEmail)}</b></span> `;
    } else if(bisa){
      const kosong = await guruKosong(ss.Hari, ss.NoJP, x.GuruEmail, IJL);
      s += `<div class="istBaris"><span class="sesiChip">⏳ ${lbl}</span>
        <select data-pgid="${x.id}" data-idx="${i}" style="width:auto;min-width:170px">
          <option value="">— pilih pengganti —</option>
          ${kosong.map(g=>`<option value="${esc(g.EmailPengguna)}">${esc(g.NamaPengguna)}</option>`).join('')}
        </select>
        <button type="button" class="btn kecil utama" data-tunjuk="${x.id}" data-idx="${i}">Tunjuk</button>
        ${kosong.length ? '' : '<span class="kecil">⚠️ Tidak ada guru kosong pada jam ini</span>'}</div>`;
    } else {
      s += `<span class="sesiChip">⏳ ${lbl}</span> `;
    }
  }
  return `<div class="ijinBaris">
    <b>${esc(x.GuruNama||'')}</b> ${chipStatus(x.Status)} ${chipJenis(x)} <span class="kecil">${x.DibuatPada?.seconds ? new Date(x.DibuatPada.seconds*1000).toLocaleString('id-ID') : ''}</span>
    <div style="margin:6px 0">${s}</div>
    <div class="kecil">Alasan: <i>${esc(x.Alasan||'')}</i></div>
    ${x.Catatan ? `<div class="kecil">📝 ${esc(x.Catatan)}</div>` : ''}
    <button type="button" class="btn kecil" data-cetak="${x.id}">🖨️ Cetak Surat</button>
  </div>`;
}

async function modIjinOp(isi){
  const p = await getDocs(query(collection(db,'pengajuan_ijin'), where('SekolahId','==',AKUN.SekolahId)));
  IJL = p.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.DibuatPada?.seconds)||0)-((a.DibuatPada?.seconds)||0));
  const menunggu = IJL.filter(x=>x.Status==='menunggu');
  const aktif = IJL.filter(x=>x.Status==='disetujui');
  const belum = aktif.filter(x=>!(x.Sesi||[]).every(s=>s.PenggantiEmail));
  const sudah = aktif.filter(x=>(x.Sesi||[]).every(s=>s.PenggantiEmail));
  const seksi = async (judul, arr, bisa)=>{
    let inner = '';
    for(const x of arr) inner += await kartuIjinOp(x, bisa);
    return `<div class="kartu"><h3>${judul} (${arr.length})</h3>${inner || '<p class="kecil">Tidak ada.</p>'}</div>`;
  };
  isi.innerHTML = `<h1 class="judul">🔄 Izin Guru & Guru Pengganti</h1>
    <p class="kecil" style="margin-bottom:10px">Permohonan ijin guru muncul di sini. Begitu KS menyetujui, tunjuk guru pengganti — daftar pilihan otomatis hanya berisi guru yang jam tersebut kosong, dan guru yang ditunjuk menerima notifikasi di aplikasinya.</p>`
    + await seksi('🎯 Wajib dicarikan pengganti', belum, true)
    + await seksi('⏳ Menunggu keputusan KS', menunggu, false)
    + await seksi('✅ Pengganti lengkap', sudah, false);
  isi.onclick = async e=>{
    const t = e.target.closest('[data-tunjuk]');
    const c = e.target.closest('[data-cetak]');
    try{
      if(t){
        const sel = isi.querySelector(`select[data-pgid="${t.dataset.tunjuk}"][data-idx="${t.dataset.idx}"]`);
        if(!sel || !sel.value){ toast('⚠️ Pilih dulu guru penggantinya'); return; }
        await tunjukPengganti(t.dataset.tunjuk, Number(t.dataset.idx), sel.value);
        return;
      }
      if(c){ const x = IJL.find(y=>y.id===c.dataset.cetak); if(x) cetakSurat(x); }
    }catch(err){ toast('⛔ '+teksErr(err)); }
  };
}
async function tunjukPengganti(id, idx, email){

  try{
    await updateDoc(doc(db,'pengajuan_ijin',id), {Sesi:sesi, PenggantiEmails:sesi.filter(s=>s.PenggantiEmail).map(s=>s.PenggantiEmail)});
    await addDoc(collection(db,'notifikasi'), {SekolahId:AKUN.SekolahId, TargetEmail:email, Judul:'🔄 Anda ditunjuk sebagai guru pengganti', Isi:`Anda menggantikan ${x.GuruNama||'guru'} pada ${sesi[idx].Hari} JP ${sesi[idx].NoJP} (${sesi[idx].Waktu||''}) — ${sesi[idx].NamaMapel||''} kelas ${sesi[idx].NamaKelas||''}. Buka menu Ijin Mengajar.`, Dibuka:false, DibuatPada:serverTimestamp()});
    if(sesi.every(s=>s.PenggantiEmail)){

    }

let LIS = {kelasId:'', baris:[], lama:null, tersimpan:'[]', mp:[], mapelAktif:'', materiFokus:null};
let UJ_TAB = 'uts';

function lisTeks(iso){
  if(!iso) return '';
  try{ return new Date(iso+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(_){ return iso; }
}
function lisJam(s){ return (s||'').replace(/:/g,'.'); }
function lisWaktu(b){ return lisJam(b.Mulai)+' - '+lisJam(b.Selesai); }
function lisMenit(s){ const p=(s||'00:00').split(':'); return Number(p[0])*60+Number(p[1]); }
function lisBarisKosong(no){ return {No:no, Tanggal:ijIso(new Date()), Mulai:'07:30', Selesai:'10:00', Meja:no, Materi:'', PengujiEmail:'', PengujiNama:'', Ruangan:''}; }
async function lisMuat(){
  LIS.lama = await ambilAtauKosong(doc(db,'ujian_lisan','LIS_'+LIS.kelasId));
  LIS.baris = (LIS.lama && LIS.lama.Baris) ? LIS.lama.Baris.map(b=>({...b})) : [];
  LIS.tersimpan = JSON.stringify((LIS.lama && LIS.lama.Baris) || []);
}
function lisTabelLihat(){
  if(!LIS.baris.length) return '<p class="kecil">Belum ada jadwal ujian lisan untuk kelas ini.</p>';
  return `<table class="tabelMini"><tr><th>No</th><th>Hari, Tanggal</th><th>Waktu (WIB)</th><th>Pos / Meja</th><th>Materi Ujian</th><th>Nama Penguji</th><th>Ruangan</th></tr>
    ${LIS.baris.map((b,i)=>`<tr><td>${b.No||i+1}</td><td>${esc(lisTeks(b.Tanggal))}</td><td>${esc(lisWaktu(b))}</td><td>Meja ${esc(b.Meja||'')}</td><td><b>${esc(b.Materi||'')}</b></td><td>${esc(b.PengujiNama||namaGuru(b.PengujiEmail)||'')}</td><td>${esc(b.Ruangan||'')}</td></tr>`).join('')}
  </table>`;
}
function tabUjianBar(){
  let bar = document.getElementById('ujTabBar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'ujTabBar'; bar.className = 'ujTabBar';
    bar.innerHTML = '<button type="button" class="ujTab" data-uftab="uts">Jadwal UTS/UAS</button><button type="button" class="ujTab oranye" data-uftab="lisan">Ujian Lisan</button>';
    bar.onclick = e=>{
      const t = e.target.closest('[data-uftab]');
      if(t && t.dataset.uftab!==UJ_TAB) tabUjianPilih(t.dataset.uftab);
    };
    el('isi').parentNode.insertBefore(bar, el('isi'));
  }
  return bar;
}
function tabUjianTampil(){
  const bar = tabUjianBar();
  bar.querySelectorAll('.ujTab').forEach(b=>b.classList.toggle('on', b.dataset.uftab===UJ_TAB));
}
function tabUjianJudul(){
  let h = document.getElementById('ujJudul');
  if(!h){
    h = document.createElement('h1');
    h.id = 'ujJudul'; h.className = 'judul'; h.textContent = '📝 Jadwal Ujian';
    el('isi').parentNode.insertBefore(h, document.getElementById('ujTabBar') || el('isi'));

  return h;
}
function tabUjianAtur(n){
  const judul = tabUjianJudul();
  const bar = tabUjianBar();
  judul.hidden = n!=='ujian';
  bar.hidden = n!=='ujian';
  if(n==='ujian'){ UJ_TAB='uts'; tabUjianTampil(); }
}
async function tabUjianPilih(tab){
  UJ_TAB = tab;

    }

  const modalMateri = ()=>{
    if(!LIS.mp.length){ toast('⚠️ Belum ada pelajaran — tambahkan dulu di menu Daftar Pelajaran.'); return; }
    bukaModal('🧩 Materi Ujian — tersimpan di Daftar Pelajaran', `
      <label>Pelajaran<select id="mtrMapel">${LIS.mp.map((m,i)=>`<option value="${i}"${m.Nama===LIS.mapelAktif?' selected':''}>${esc(m.Nama)}</option>`).join('')}</select></label>

      <p class="kecil">Materi tersimpan permanen di Daftar Pelajaran — tidak ikut terhapus saat reset tahunan. Ketuk pelajarannya di atas, materinya tampil di bawah sesuai pelajaran yang dipilih.</p>`,
      [{label:'💾 Simpan', cb:async ()=>{
        const m = LIS.mp[Number(el('mtrMapel').value)];
        const nama = el('mtrNama').value.trim().toUpperCase();
        if(!nama){ toast('⚠️ Tulis nama materinya dulu.'); return; }

        materi.push(nama);
        try{
          await updateDoc(doc(db,'mapel_sekolah',m.id), {Materi:materi});
          toast('✅ Materi "'+nama+'" tersimpan ke pelajaran '+m.Nama);
          LIS.mapelAktif = m.Nama;

  isi.onfocusin = e=>{

/* ---------- alat migrasi master guru ---------- */
let MIG = {data:[], baru:[], dilewati:[], tanpaNug:0, kolomAneh:[]};

function migParseCsv(teks){
  teks = teks.replace(/^\ufeff/,'');
  const baris = []; let sel = '', satu = [], dalam = false;
  for(let i=0;i<teks.length;i++){
    const c = teks[i];
    if(dalam){
      if(c==='"'){ if(teks[i+1]==='"'){ sel+='"'; i++; } else dalam = false; }
      else sel += c;
    } else if(c==='"'){ dalam = true; }
    else if(c===','){ satu.push(sel); sel = ''; }
    else if(c==='\n' || c==='\r'){ if(sel!=='' || satu.length){ satu.push(sel); baris.push(satu); satu = []; sel = ''; } }
    else sel += c;
  }
  if(sel!=='' || satu.length){ satu.push(sel); baris.push(satu); }
  return baris;
}
function migIso(nilai){
  const t = String(nilai||'').trim(); if(!t) return '';
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return t;
}

      <div class="barisTombol"><button type="button" class="btn utama" id="migBaca">🔍 Baca &amp; Pratinjau</button></div>
      <div id="migHasil" style="margin-top:12px"></div>
    </div>`;
  el('migFile').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    await migProses(await f.text());
  };
  el('migBaca').onclick = async ()=>{
    const t = el('migTempel').value.trim();
    if(!t){ toast('⚠️ Pilih file CSV atau tempel isinya dulu.'); return; }
    await migProses(t);
  };
}
async function migProses(teks){
  MIG = {data:[], baru:[], dilewati:[], tanpaNug:0, kolomAneh:[]};
  const tabel = migParseCsv(teks);
  if(tabel.length<2){ toast('⚠️ CSV kosong atau tidak terbaca.'); return; }
  const header = tabel[0].map(h=>String(h||'').trim().toUpperCase());
  const idx = {}; header.forEach((h,i)=>{ if(h) idx[h]=i; });
  if(idx['NUG']===undefined || idx['NAMA']===undefined){ toast('⚠️ Kolom NUG / NAMA tidak ditemukan — pastikan ini tab MASTER GURU.'); return; }
  header.forEach(h=>{ if(h && !MIG_DIPAKAI.includes(h) && h!=='PASSWORD') MIG.kolomAneh.push(h); });
  if(idx['PASSWORD']!==undefined) MIG.kolomAneh.push('PASSWORD (sengaja tidak dipindah)');
  for(let r=1;r<tabel.length;r++){
    const raw = tabel[r];
    if(!raw || raw.every(v=>String(v||'').trim()==='')) continue;
    const ambil = k => idx[k]!==undefined ? String(raw[idx[k]]||'').trim() : '';
    const nug = ambil('NUG');
    if(!nug){ MIG.tanpaNug++; continue; }
    MIG.data.push({
      SekolahId: AKUN.SekolahId, NUG: nug, Nama: ambil('NAMA'), JK: ambil('JK'),
      TempatLahir: ambil('TEMPAT LAHIR'), TglLahir: migIso(ambil('TGL LAHIR')), Jabatan: ambil('JABATAN'),
      NIK: ambil('NIK'), NoKK: ambil('NO. KK'), NRG: ambil('NRG'), NUPTK: ambil('NUPTK'), TMT: ambil('TMT'),
      NoSkPengangkatan: ambil('NO. SK. PENGANGKATAN'),
      SuamiNama: ambil('NAMA SUAMI'), SuamiNik: ambil('NIK SUAMI'), SuamiTglLahir: migIso(ambil('TGL. LAHIR SUAMI')), SuamiPekerjaan: ambil('PEKERJAAN SUAMI'),
      IbuNama: ambil('NAMA IBU'), IbuNik: ambil('NIK IBU'), IbuTglLahir: migIso(ambil('TGL. LAHIR IBU')), IbuPekerjaan: ambil('PEKERJAAN IBU'),
      Alamat: ambil('ALAMAT LENGKAP'), Wa: ambil('NO. WA'), Email: (ambil('E-MAIL AKTIF')||'').toLowerCase(),
      LinkFoto: ambil('LINK FOTO'), LinkKtp: ambil('LINK FOTO KTP'), LinkKk: ambil('LINK FOTO KK'),
      LinkIjazah: ambil('LINK FOTO IJAZAH'), LinkTranskip: ambil('LINK FOTO TRANSKIP NILAI'), LinkSk: ambil('LINK FOTO SK. PENGANGKATAN'),
      Status: ambil('STATUS'), Keterangan: ambil('KETERANGAN'), TimestampCsv: ambil('TIMESTAMP'),
      Sumber: 'MASTER GURU (CSV)', DibuatPada: serverTimestamp()
    });
  }
  const ada = await getDocs(query(collection(db,'guru_biodata'), where('SekolahId','==',AKUN.SekolahId)));
  const sudah = new Set(); ada.docs.forEach(d=>{ const x = d.data(); if(x.NUG) sudah.add(String(x.NUG)); });
  MIG.dilewati = MIG.data.filter(b=>sudah.has(String(b.NUG)));
  MIG.baru = MIG.data.filter(b=>!sudah.has(String(b.NUG)));
  el('migHasil').innerHTML = `<div class="kartu" style="background:rgba(148,163,184,.1)">
    <b>🔍 Pratinjau</b>
    <p class="kecil">Baris terbaca: ${tabel.length-1} · Valid: ${MIG.data.length} · Tanpa NUG (dilewati): ${MIG.tanpaNug} · NUG sudah ada di Firestore (dilewati): ${MIG.dilewati.length}${MIG.kolomAneh.length?('<br>Kolom lain/abaikan: '+esc(MIG.kolomAneh.join(', '))):''}</p>
    ${MIG.baru.length ? `<table class="tabelMini"><tr><th>NUG</th><th>Nama</th><th>JK</th><th>Tgl Lahir</th><th>Email</th><th>Status</th></tr>
      ${MIG.baru.slice(0,5).map(b=>`<tr><td>${esc(b.NUG)}</td><td>${esc(b.Nama)}</td><td>${esc(b.JK)}</td><td>${esc(b.TglLahir)}</td><td>${esc(b.Email)}</td><td>${esc(b.Status)}</td></tr>`).join('')}</table>
      ${MIG.baru.length>5?'<p class="kecil">… dan '+(MIG.baru.length-5)+' baris lainnya.</p>':''}
      <div class="barisTombol"><button type="button" class="btn utama" id="migJalankan">⬆️ Mulai Migrasi (${MIG.baru.length} dokumen)</button></div>`
    : '<p class="kecil">Tidak ada baris baru untuk dimigrasi.</p>'}
  </div>`;
  const btn = el('migJalankan'); if(btn) btn.onclick = migJalankan;
}
async function migJalankan(){
  const btn = el('migJalankan'); btn.disabled = true;
  let ok = 0, gagal = 0;
  for(let i=0;i<MIG.baru.length;i++){
    btn.textContent = '⏳ Memigrasi… '+(i+1)+'/'+MIG.baru.length;
    try{ await setDoc(doc(collection(db,'guru_biodata')), MIG.baru[i]); ok++; }catch(err){ gagal++; }
  }
  el('migHasil').innerHTML = `<div class="kartu" style="background:rgba(16,185,129,.12)">
    <b>✅ Selesai</b>
    <p class="kecil">Berhasil: <b>${ok}</b> dokumen · Gagal: ${gagal}${MIG.tanpaNug?' · Tanpa NUG: '+MIG.tanpaNug:''}</p>
    ${MIG.dilewati.length?'<p class="kecil">Dilewati (NUG sudah ada): '+esc(MIG.dilewati.map(b=>b.NUG+' — '+b.Nama).join('; '))+'</p>':''}
    <p class="kecil">Biodata kini tersimpan di koleksi <b>guru_biodata</b> (dilihat lewat Firebase Console). Foto masih berupa link Drive — pemindahan berkasnya menyusul di fase galeri. Tampilannya di menu Daftar Guru akan kita sambungkan pada tahap berikutnya.</p>
  </div>`;
}

/* ---------- statistik beranda KS (1 tahun, klik bulan untuk detail) ---------- */
let BER = {ijin:[], ta:'', pilih:{ijin:null, guru:null, siswa:null}};
function taDari(milidetik){
  const d = new Date(milidetik);
  const y = d.getFullYear();
  return d.getMonth() >= 6 ? `${y}/${y+1}` : `${y-1}/${y}`; // TA = Juli s.d. Juni
}
const BLN_TA = [['Jul',6],['Agu',7],['Sep',8],['Okt',9],['Nov',10],['Des',11],['Jan',0],['Feb',1],['Mar',2],['Apr',3],['Mei',4],['Jun',5]];
function brTaOf(x){ return x.DibuatPada?.seconds ? taDari(x.DibuatPada.seconds*1000) : (x.TahunAjaran || '-'); }
function brBulanIjin(x){ return x.DibuatPada?.seconds ? new Date(x.DibuatPada.seconds*1000).getMonth() : -1; }
function brBulanTahun(mi){ const y = parseInt((BER.ta||'').split('/')[0],10) || new Date().getFullYear(); return mi>=6 ? y : y+1; }
function brNamaBulan(mi){ return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][mi] || ''; }
function brIjinDalamTa(){ return BER.ijin.filter(x=>brTaOf(x)===BER.ta); }
function brChips(key, nilai){
  return BLN_TA.map((b,i)=>`<button type="button" class="chipHari${BER.pilih[key]===b[1]?' on':''}" data-brbln="${key}:${b[1]}" style="min-width:52px">${b[0]}${nilai!=null?`<b> ${nilai[i]}</b>`:''}</button>`).join('');
}
function brIjinRender(){
  const dalam = brIjinDalamTa();
  const bul = new Array(12).fill(0).map(()=>({peng:0,sesi:0,ok:0,tolak:0,tunggu:0}));
  dalam.forEach(x=>{
    const i = BLN_TA.findIndex(b=>b[1]===brBulanIjin(x));
    if(i<0) return;
    const n = (x.Sesi||[]).length;
    bul[i].peng++; bul[i].sesi += n;
    if(x.Status==='disetujui') bul[i].ok++; else if(x.Status==='ditolak') bul[i].tolak++; else bul[i].tunggu++;
  });
  const tot = bul.reduce((a,b)=>({peng:a.peng+b.peng, sesi:a.sesi+b.sesi, ok:a.ok+b.ok, tolak:a.tolak+b.tolak, tunggu:a.tunggu+b.tunggu}), {peng:0,sesi:0,ok:0,tolak:0,tunggu:0});
  const p = BER.pilih.ijin;
  let detail = '';
  if(p!=null){
    const i = BLN_TA.findIndex(b=>b[1]===p);
    const bln = bul[i] || {peng:0,sesi:0,ok:0,tolak:0,tunggu:0};
    const list = dalam.filter(x=>brBulanIjin(x)===p).sort((a,b)=>((b.DibuatPada?.seconds)||0)-((a.DibuatPada?.seconds)||0));
    detail = `<div style="margin-top:8px;border-top:1px solid var(--garis);padding-top:8px">
      <b>📅 ${brNamaBulan(p)} ${brBulanTahun(p)}</b> — ${bln.peng} pengajuan · ${bln.sesi} sesi ijin · 👍 ${bln.ok} · ❌ ${bln.tolak} · ⏳ ${bln.tunggu}
      <table class="tabelMini"><tr><th>Guru</th><th>Sesi</th><th>Status</th></tr>
        ${list.map(x=>`<tr><td>${esc(x.GuruNama||x.GuruEmail||'')}</td><td>${(x.Sesi||[]).length}</td><td>${chipStatus(x.Status)}</td></tr>`).join('') || '<tr><td colspan="3" class="kecil">Tidak ada ijin pada bulan ini</td></tr>'}
      </table>
      <p class="kecil" style="margin-top:4px">Klik bulan yang sama lagi untuk kembali ke tampilan setahun.</p></div>`;
  }
  el('brStatIjin').innerHTML = `<h3>🌴 Ijin Guru — TA ${esc(BER.ta)} (1 tahun)</h3>
    <div class="kecil">Total ${tot.peng} pengajuan · ${tot.sesi} sesi/JP ijin · 👍 ${tot.ok} · ❌ ${tot.tolak} · ⏳ ${tot.tunggu}. Klik bulan untuk rincian bulan itu.</div>
    <div class="barisTombol">${brChips('ijin', bul.map(b=>b.sesi))}</div>
    ${detail}`;
}
function brKehadiranRender(key){
  const p = BER.pilih[key];
  const judul = key==='guru' ? '👨‍🏫 Kehadiran Guru' : '🎓 Kehadiran Siswa';
  const siapa = key==='guru' ? 'kehadiran guru' : 'kehadiran siswa';
  let detail = '';
  if(p!=null){
    detail = `<div style="margin-top:8px;border-top:1px solid var(--garis);padding-top:8px"><b>📅 ${brNamaBulan(p)} ${brBulanTahun(p)}</b>
      <p class="kecil" style="margin-top:4px">Belum ada data presensi bulan ini. Jumlah hadir, ijin, dan alfa ${siapa} akan tampil otomatis di sini setelah modul presensi harian aktif.</p>
      <p class="kecil">Klik bulan yang sama lagi untuk kembali ke tampilan setahun.</p></div>`;
  }
  el(key==='guru' ? 'brStatGuru' : 'brStatSiswa').innerHTML = `<h3>${judul} — TA ${esc(BER.ta)} (1 tahun)</h3>
    <p class="kecil" style="margin:2px 0">Menunggu modul presensi harian — setelah aktif, statistik ${siapa} terisi otomatis di sini, per bulan.</p>
    <div class="barisTombol">${brChips(key, null)}</div>
    ${detail}`;
}
function brStatKlik(e){
  const b = e.target.closest('[data-brbln]');
  if(!b) return;
  const bag = b.dataset.brbln.split(':');
  const key = bag[0], mi = parseInt(bag[1],10);
  BER.pilih[key] = BER.pilih[key]===mi ? null : mi;
  if(key==='ijin') brIjinRender(); else brKehadiranRender(key);
}
function brStatAwal(){
  BER.ta = SEKOLAH.TahunAjaran || taDari(Date.now());
  brIjinRender();
  brKehadiranRender('guru');
  brKehadiranRender('siswa');
  ['brStatIjin','brStatGuru','brStatSiswa'].forEach(id=>{ el(id).onclick = brStatKlik; });
}

      ? `<label class="kecil" style="font-weight:600;display:block;margin-bottom:3px">Pilihan jawaban — teks, gambar, atau keduanya</label><div class="bsOpsiGrid">${['A','B','C','D'].map(h=>`<label class="kecil">Pilihan ${h.toUpperCase()}<input id="bsOpsi${h}" placeholder="teks pilihan — boleh kosong bila hanya gambar"><span class="barisAtas" style="margin-top:4px;gap:6px"><button type="button" class="btn kecil" data-opsigbr="${h}">🖼️ + Gambar</button><span id="bsOpsiPrev${h}" class="barisAtas" style="margin:0;gap:4px"></span></span></label>`).join('')}</div>`
      : BS.bagian==='C'
      ? `<label class="kecil" style="font-weight:600;display:block;margin-bottom:3px">Jawaban soal ini — masuk daftar jawaban di bagian bawah lembar</label><input id="bsJawabC" placeholder="mis. terjemahan / jawaban singkat soal ini" style="margin-bottom:10px">`
      : '';
    if(BS.bagian==='A') ['A','B','C','D'].forEach(h=>gambarThumbOpsi(h));
  };
  const ringkasTeks = t => String(t).replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
  const kertasDariSoal = ()=>{
    const bagianAda = ['A','B','C','D'].filter(b=>BS.soal.some(s=>s.Bagian===b));
    return `<div style="text-align:center;border-bottom:3px double #111;padding:10px 80px;margin-bottom:12px">
        ${SEKOLAH.LogoSekolah?`<img src="${esc(SEKOLAH.LogoSekolah)}" class="bsLogo" draggable="false" style="left:0px;top:2px">`:''}
        <div style="font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase">${esc(SEKOLAH.NamaSekolah||'Nama Sekolah')}</div>
        <div style="font-size:12px;text-transform:uppercase">${esc(SEKOLAH.AlamatSekolah||'Alamat Sekolah')}</div>
        <div style="font-size:12px">TAHUN AJARAN ${esc(SEKOLAH.TahunAjaran||taDefault())}</div>
      </div>
      <div style="text-align:center;font-weight:700;font-size:15px;margin-bottom:10px">${BS.jenis==='UTS'?'ULANGAN TENGAH SEMESTER':'ULANGAN AKHIR SEMESTER'} — SEMESTER ${BS.jenis==='UTS'?'GANJIL':'GENAP'}</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:14px">
        <tr style="border-top:1.5px solid #111">
          <td style="width:132px;padding:4px 6px">Mata Pelajaran :</td>
          <td style="padding:4px 6px"><b>${esc(BS.mapel||'—')}</b></td>
          <td style="width:70px;padding:4px 6px">Kelas :</td>
          <td style="padding:4px 6px"><b>${esc(namaKelas())}</b></td>
        </tr>
        <tr>
          <td style="padding:4px 6px">Nama :</td>
          <td style="padding:4px 6px">...........................</td>
          <td style="padding:4px 6px">NIS :</td>
          <td style="padding:4px 6px">...................</td>
        </tr>
        <tr style="border-bottom:1.5px solid #111">
          <td style="padding:4px 6px">Guru :</td>
          <td style="padding:4px 6px"><b>${esc(AKUN.NamaPengguna || (BS.dok&&BS.dok.GuruNama) || '')}</b></td>
          <td style="padding:4px 6px">Semester :</td>
          <td style="padding:4px 6px"><b>${BS.jenis==='UTS'?'Ganjil':'Genap'}</b></td>
        </tr>
      </table>
      ${BS.soal.length ? bagianAda.map(b=>{
        const daftar = BS.soal.map((s,i)=>({s,i})).filter(x=>x.s.Bagian===b);
        const jawabC = b==='C' ? daftar.map((x,n)=>({h:String.fromCharCode(97+n), t:x.s.Jawaban})).filter(x=>x.t) : [];
        return `<div style="margin-top:12px;text-align:left;font-size:14px">
          <b>${b}. ${esc(BS.instruksi[b]||BS_INSTR[b]||'')}</b>
          ${daftar.map((x,n)=>{
            const gbr = (x.s.Gambar || x.s.GbrUrl) ? `<img src="${esc(x.s.Gambar||x.s.GbrUrl)}" style="max-width:230px;border:1px solid #9CA3AF;margin-top:4px">` : '';
            return `<div class="bsSoalBlok" data-isi="${x.i}" style="margin-top:8px">${n+1}. ${String(x.s.Teks).includes('<') ? String(x.s.Teks) : `<span style="white-space:pre-wrap">${esc(x.s.Teks)}</span>`}${gbr}<button type="button" class="bsSoalHapus" data-bshapus="${x.i}" contenteditable="false" title="Hapus soal ini dari lembar">🗑</button>
            ${x.s.Opsi?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 20px;margin-top:4px;font-size:13px">${['A','B','C','D'].map(h=>`<span>${h.toLowerCase()}. ${esc(x.s.Opsi[h]||(x.s.OpsiGbr&&x.s.OpsiGbr[h]?'':'…'))}${x.s.OpsiGbr&&x.s.OpsiGbr[h]?`<img src="${esc(x.s.OpsiGbr[h])}" style="max-width:130px;max-height:110px;object-fit:contain;display:block;margin:2px 0">`:''}</span>`).join('')}</div>`:''}</div>`;
          }).join('')}
          ${jawabC.length?`<div style="margin-top:10px;border-top:1px dashed #555;padding-top:6px"><b>Jawaban :</b>${jawabC.map(x=>`<span style="display:block;margin-top:3px">${x.h}. ${esc(x.t)}</span>`).join('')}</div>`:''}
        </div>`;
      }).join('') : '<p style="text-align:center;color:#6B7280;margin-top:14px">Belum ada soal — soal yang Anda simpan tampil di sini, dan lembar ini bebas Anda ubah.</p>'}`;
  };
  const pasangTombolHapus = ()=>{
    el('bsEditor').querySelectorAll('.bsSoalBlok[data-isi]').forEach(b=>{
      if(b.querySelector('[data-bshapus]')) return;
      const tb = document.createElement('button');
      tb.type='button'; tb.className='bsSoalHapus'; tb.contentEditable=false; tb.title='Hapus soal ini dari lembar';
      tb.dataset.bshapus = b.dataset.isi; tb.textContent='🗑';
      b.appendChild(tb);
    });
  };
  const muatEditor = ()=>{
    el('bsEditor').innerHTML = (BS.dok && BS.dok.Lembar) ? BS.dok.Lembar : kertasDariSoal();
    BS.lembarKotor = false;
    pasangTombolHapus();
  };
  const perbaruiRingkas = ()=>{
    el('bsJumlah').textContent = BS.soal.length;
    el('bsStatus').textContent = BS.dikumpulkan ? '✅ Sudah dikumpulkan ke KS & Operator' : 'Belum dikumpulkan';
  };
  const aturSemua = ()=>{
    el('bsSemester').textContent = BS.jenis==='UTS'?'Ganjil':'Genap';
    el('bsInstr').value = BS.instruksi[BS.bagian] || BS_INSTR[BS.bagian] || '';
    gambarTabs(); gambarOpsi(); perbaruiRingkas();
  };
  el('bsTabs').onclick = e=>{
    const t = e.target.closest('[data-bsb]'); if(!t) return;
    BS.bagian = t.dataset.bsb;
    aturSemua();
  };
  let opsiTarget = null;
  el('bsOpsi').onclick = e=>{
    const g = e.target.closest('[data-opsigbr]');
    if(g){ opsiTarget = g.dataset.opsigbr; el('bsFileOpsi').click(); return; }
    const r = e.target.closest('[data-opsirms]');
    if(r){ delete BS.opsiGbr[r.dataset.opsirms]; gambarThumbOpsi(r.dataset.opsirms); }
  };
  el('bsFileOpsi').onchange = async e=>{
    const f = e.target.files[0]; if(!f || !opsiTarget) return;
    toast('⏳ Memproses gambar…');
    try{ BS.opsiGbr[opsiTarget] = await gbGambarKeUrl(f, GOOGLE.id?800:500, GOOGLE.id?.7:.55); gambarThumbOpsi(opsiTarget); toast('🖼️ Gambar ditempel di pilihan '+opsiTarget.toUpperCase()); }
    catch(_){ toast('⛔ Gambar gagal diproses.'); }
    e.target.value='';
  };
  let teksKursor = null;
  const simpanKursorTeks = ()=>{
    const s = window.getSelection();
    if(s && s.rangeCount && el('bsTeks').contains(s.anchorNode)) teksKursor = s.getRangeAt(0).cloneRange();
  };
  el('bsTeks').addEventListener('keyup', simpanKursorTeks);
  el('bsTeks').addEventListener('mouseup', simpanKursorTeks);
  el('bsTeksGbr').onclick = ()=>{ el('bsFileTeks').click(); };
  el('bsFileTeks').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    toast('⏳ Memproses gambar…');
    try{
      const url = await gbGambarKeUrl(f, GOOGLE.id?1200:700, GOOGLE.id?.75:.55);
      const ed = el('bsTeks');
      if(teksKursor && ed.contains(teksKursor.startContainer)){
        const s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(teksKursor.cloneRange());
      }
      ed.focus();
      const img = document.createElement('img');
      img.src = url;
      const sel = window.getSelection();
      if(sel && sel.rangeCount && ed.contains(sel.anchorNode)){
        const r = sel.getRangeAt(0); r.collapse(false); r.insertNode(img);
        const setelah = document.createRange(); setelah.setStartAfter(img); setelah.collapse(true);
        sel.removeAllRanges(); sel.addRange(setelah);
      } else { ed.appendChild(img); }
      teksKursor = null;
      toast('🖼️ Gambar ditempel di soal — lanjut mengetik atau tempel gambar lagi');
    }catch(_){ toast('⛔ Gambar gagal diproses.'); }
    e.target.value='';
  };
  el('bsEditor').oninput = ()=>{ BS.lembarKotor = true; };
  let bsKursor = null, bsImgAktif = null;
  const bsSimpanKursor = ()=>{
    const s = window.getSelection();
    if(s && s.rangeCount && el('bsEditor').contains(s.anchorNode)) bsKursor = s.getRangeAt(0).cloneRange();
  };
  el('bsEditor').addEventListener('keyup', bsSimpanKursor);
  el('bsEditor').addEventListener('mouseup', bsSimpanKursor);
  el('bsSisipGbr').onclick = ()=>{ el('bsFileEditor').click(); };
  el('bsFileEditor').onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const url = await gbKompresFoto(file, 900, .55);
      const ed = el('bsEditor');
      if(bsKursor && ed.contains(bsKursor.startContainer)){
        const s2 = window.getSelection(); s2.removeAllRanges(); s2.addRange(bsKursor.cloneRange());
      }
      ed.focus();
      const img = document.createElement('img');
      img.src = url; img.style.maxWidth = '230px';
      const sel = window.getSelection();
      if(sel && sel.rangeCount && ed.contains(sel.anchorNode)){
        const r = sel.getRangeAt(0); r.collapse(false); r.insertNode(img);
      } else { ed.appendChild(img); }
      bsKursor = null;
      BS.lembarKotor = true;
      toast('🖼️ Gambar disisipkan — klik gambar untuk mengatur ukuran/putar, seret untuk memindahkan');
    }catch(_){ toast('⛔ Gambar gagal diproses.'); }
    e.target.value='';
  };
  el('bsTambahLogo').onclick = ()=>{ el('bsFileLogo').click(); };
  el('bsFileLogo').onchange = async e=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const url = await gbKompresFoto(file, 500, .8);
      const img = document.createElement('img');
      img.src = url; img.className = 'bsLogo'; img.draggable = false;
      img.style.left = '0px'; img.style.top = '2px';
      el('bsEditor').appendChild(img);
      BS.lembarKotor = true;
      toast('🏫 Logo ditambahkan — seret untuk memindahkan, klik untuk mengatur');
    }catch(_){ toast('⛔ Gambar gagal diproses.'); }
    e.target.value='';
  };
  el('bsEditor').onmousedown = e=>{
    const img = e.target.closest('img'); if(!img) return;
    e.preventDefault();
    const ed = el('bsEditor');
    const rEd = ed.getBoundingClientRect();
    const awalX = e.clientX, awalY = e.clientY;
    let melayang = (getComputedStyle(img).position === 'absolute');
    let awalL = 0, awalT = 0;
    const mulaiSeret = ()=>{
      const rImg = img.getBoundingClientRect();
      awalL = rImg.left - rEd.left; awalT = rImg.top - rEd.top;
      if(!melayang){
        img.style.width = Math.round(rImg.width) + 'px';
        img.style.height = 'auto';
        img.style.maxWidth = 'none';
        img.style.left = awalL + 'px'; img.style.top = awalT + 'px';
        img.style.position = 'absolute';
        ed.appendChild(img);
        melayang = true;
      }
    };
    const gerak = ev=>{
      if(!melayang){
        if(Math.abs(ev.clientX-awalX)<5 && Math.abs(ev.clientY-awalY)<5) return;
        mulaiSeret();
      }
      img.style.left = (awalL + ev.clientX - awalX) + 'px';
      img.style.top = (awalT + ev.clientY - awalY) + 'px';
      BS.lembarKotor = true;
    };
    const lepas = ()=>{ document.removeEventListener('mousemove', gerak); document.removeEventListener('mouseup', lepas); };
    document.addEventListener('mousemove', gerak);
    document.addEventListener('mouseup', lepas);
  };
  el('bsEditor').addEventListener('dragstart', e=>{ if(e.target.closest && e.target.closest('img')) e.preventDefault(); });
  el('bsEditor').onclick = async e=>{
    const hs = e.target.closest('[data-bshapus]');
    if(hs){
      const i = Number(hs.dataset.bshapus), s = BS.soal[i];
      if(!s) return;
      const lanjut = await konfirmasi('Hapus soal ini dari lembar? ("'+ringkasTeks(s.Teks).slice(0,40)+(ringkasTeks(s.Teks).length>40?'…':'')+'")');
      if(!lanjut) return;
      BS.soal.splice(i,1);
      const blok = hs.closest('.bsSoalBlok'); if(blok) blok.remove();
      el('bsEditor').querySelectorAll('[data-bshapus]').forEach(b=>{ const bi = Number(b.dataset.bshapus); if(bi>i) b.dataset.bshapus = String(bi-1); });
      el('bsEditor').querySelectorAll('.bsSoalBlok[data-isi]').forEach(b=>{ const bi = Number(b.dataset.isi); if(bi>i) b.dataset.isi = String(bi-1); });
      try{ await bsSimpanDok(namaKelas()); toast('🗑 Soal dihapus dari lembar'); }
      catch(err){ toast('⛔ '+teksErr(err)); }
      aturSemua();
      return;
    }
    const img = e.target.closest('img');
    const p = el('bsImgTool');
    if(!img){ if(p) p.hidden = true; bsImgAktif = null; return; }
    bsImgAktif = img;
    if(!p) return;
    const r = img.getBoundingClientRect();
    p.hidden = false;
    p.style.left = Math.max(8, Math.min(window.innerWidth - 200, r.left)) + 'px';
    p.style.top = Math.max(8, r.top - 48) + 'px';
  };
  el('bsImgTool').onclick = async e=>{
    const b = e.target.closest('[data-bsgbr]'); if(!b || !bsImgAktif) return;
    const img = bsImgAktif, a = b.dataset.bsgbr;
    if(a==='-' || a==='+'){
      let w = img.style.width ? parseInt(img.style.width) : (img.offsetWidth || 230);
      w = Math.max(60, Math.min(600, w + (a==='+' ? 30 : -30)));
      img.style.width = w + 'px'; img.style.height = 'auto';
    } else if(a==='putar'){
      const m = String(img.style.transform||'').match(/rotate\((-?\d+)/);
      img.style.transform = 'rotate(' + (((m ? Number(m[1]) : 0) + 90) % 360) + 'deg)';
    } else if(a==='bw'){
      img.style.filter = img.style.filter ? '' : 'grayscale(1)';
    } else if(a==='hapus'){
      const yakin = await konfirmasi('Hapus gambar ini dari lembar?'); if(!yakin) return;
      img.remove(); el('bsImgTool').hidden = true; bsImgAktif = null;
    }
    BS.lembarKotor = true;
  };
  el('bsSusunUlang').onclick = async ()=>{
    const lanjut = await konfirmasi('Susun ulang lembar dari daftar soal? Perubahan manual pada lembar akan hilang — simpan dulu (💾) bila masih perlu.');
    if(!lanjut) return;
    el('bsEditor').innerHTML = kertasDariSoal();
    BS.lembarKotor = false;
    toast('🔄 Lembar disusun ulang dari daftar soal');
  };
  el('bsSimpanLembar').onclick = async ()=>{
    const b = el('bsSimpanLembar'); b.disabled = true;
    try{
      await bsSimpanDok(namaKelas());
      BS.lembarKotor = false;
      toast('💾 Lembar soal tersimpan');
    }catch(err){ toast('⛔ '+teksErr(err)); }
    b.disabled = false;
  };
  el('bsKelas').onchange = async e=>{ BS.kelasId = e.target.value; await bsMuat(); aturSemua(); muatEditor(); };
  el('bsMapel').onchange = async e=>{ BS.mapel = e.target.value; await bsMuat(); aturSemua(); muatEditor(); };
  el('bsJenis').onchange = async e=>{ BS.jenis = e.target.value; await bsMuat(); aturSemua(); muatEditor(); };
  el('bsSimpanSoal').onclick = async ()=>{
    const teks = el('bsTeks').innerHTML;
    const polos = ringkasTeks(teks);
    if(!polos && !teks.includes('<img')){ toast('⚠️ Tulis dulu soalnya (atau tempel gambarnya).'); return; }
    const opsi = {};
    const opsiGbr = {};
    if(BS.bagian==='A'){
      ['A','B','C','D'].forEach(h=>{ opsi[h] = String(el('bsOpsi'+h).value||'').trim(); if(BS.opsiGbr[h]) opsiGbr[h] = BS.opsiGbr[h]; });
      if(['A','B','C','D'].some(h=>!opsi[h] && !opsiGbr[h])){ toast('⚠️ GAYA A pilihan ganda — lengkapi keempat pilihan (teks atau gambar).'); return; }
    }
    const jawabC = BS.bagian==='C' ? String(el('bsJawabC').value||'').trim() : '';
    if(BS.bagian==='C' && !jawabC){ toast('⚠️ GAYA C mencocokkan — tulis jawaban soal ini (masuk daftar jawaban).'); return; }
    BS.instruksi[BS.bagian] = el('bsInstr').value.trim() || BS_INSTR[BS.bagian];
    BS.soal.push({Bagian:BS.bagian, Teks:teks, Gambar:BS.gambar||'', GbrUrl:BS.gUrl||'', Opsi:BS.bagian==='A'?opsi:null, OpsiGbr:BS.bagian==='A'?(Object.keys(opsiGbr).length?opsiGbr:null):null, Jawaban:jawabC||''});
    const b = el('bsSimpanSoal'); b.disabled = true; b.textContent = '⏳ MENYIMPAN…';
    try{
      if(!BS.lembarKotor) el('bsEditor').innerHTML = kertasDariSoal();
      await bsSimpanDok(namaKelas());
      el('bsTeks').innerHTML = '';
      if(BS.bagian==='A') ['A','B','C','D'].forEach(h=>{ el('bsOpsi'+h).value = ''; });
      if(BS.bagian==='C'){ const jc = el('bsJawabC'); if(jc) jc.value = ''; }
      BS.gambar = ''; BS.gUrl = ''; BS.opsiGbr = {};
      toast('✅ Soal tersimpan (total '+BS.soal.length+') — silakan ketik soal berikutnya'+(BS.lembarKotor?' — lembar tidak diubah, klik 🔄 Susun dari Soal bila ingin susun ulang':''));
      aturSemua();
    }catch(err){ BS.soal.pop(); toast('⛔ '+teksErr(err)+' — soal belum tersimpan, silakan ulangi.'); }
    finally{ b.disabled = false; b.textContent = '➕ Simpan Soal'; }
  };
  el('bsKumpul').onclick = async ()=>{
    if(!BS.soal.length){ toast('⚠️ Belum ada soal untuk dikumpulkan.'); return; }
    const lanjut = await konfirmasi('Kumpulkan soal '+BS.jenis+' '+BS.mapel+' Kelas '+namaKelas()+' kepada Kepala Sekolah & Operator?');
    if(!lanjut) return;
    const b = el('bsKumpul'); b.disabled = true; b.textContent = '⏳ MENGUMPULKAN…';
    try{
      BS.dikumpulkan = true;
      await bsSimpanDok(namaKelas());
      const ak = await getDocs(query(collection(db,'akun_pengguna'), where('SekolahId','==',AKUN.SekolahId)));
      const tujuan = ak.docs.map(d=>d.data()).filter(a=>(a.Peran==='operator'||a.Peran==='kepala_sekolah') && (a.StatusAkun||'aktif')==='aktif' && a.EmailPengguna);
      for(const t of tujuan){
        await addDoc(collection(db,'notifikasi'), {SekolahId:AKUN.SekolahId, TargetEmail:t.EmailPengguna, Judul:'✍️ Soal '+BS.jenis+' dikumpulkan', Isi:AKUN.NamaPengguna+' mengumpulkan soal '+BS.jenis+' '+BS.mapel+' Kelas '+namaKelas()+' ('+BS.soal.length+' soal).', Dibuka:false, DibuatPada:serverTimestamp()});
      }
      toast('📨 Soal dikumpulkan — penerima: '+(tujuan.length||0));
      aturSemua();
    }catch(err){ toast('⛔ '+teksErr(err)); }
    finally{ b.disabled = false; b.textContent = '📨 Kumpulkan ke KS & Operator'; }
  };
  aturSemua();
  muatEditor();
}

/* ---------- soal masuk (op & ks) ---------- */
async function modSoalMasuk(isi){
  let daftar = [];
  const muat = async ()=>{
    const s = await getDocs(query(collection(db,'soal_ujian'), where('SekolahId','==',AKUN.SekolahId)));
    daftar = s.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>((b.Dikumpulkan?1:0)-(a.Dikumpulkan?1:0)) || ((b.DiperbaruiPada?.seconds||0)-((a.DiperbaruiPada?.seconds)||0)));
    if(!daftar.length){
      isi.innerHTML = `<h1 class="judul">📥 Soal Ujian dari Guru</h1>
        <div class="kartu"><p>Belum ada soal dari guru. Guru membuat soal di menu <b>✍️ Buat Soal Ujian</b> lalu menekan tombol <b>📨 Kumpulkan ke KS &amp; Operator</b> — soalnya akan muncul di sini.</p></div>`;
      return;
    }
    isi.innerHTML = `<h1 class="judul">📥 Soal Ujian dari Guru</h1>
      ${daftar.map(d=>`<div class="kartu">
        <div class="barisAtas"><h3 style="margin:0">${d.Dikumpulkan?'✅':'⏳'} ${esc(d.Jenis||'')} — ${esc(d.Mapel||'—')}</h3>
          <span class="kecil">Kelas ${esc(d.NamaKelas||'—')}</span></div>
        <p class="kecil">✍️ ${esc(d.GuruNama||namaGuru(d.GuruEmail)||d.GuruEmail||'—')} · ${(d.Soal||[]).length} soal · Semester ${esc(d.Semester||'—')} · TA ${esc(d.TahunAjaran||'—')} · diperbarui ${d.DiperbaruiPada&&d.DiperbaruiPada.seconds?new Date(d.DiperbaruiPada.seconds*1000).toLocaleString('id-ID'):'—'}</p>
        <button type="button" class="btn utama kecil" data-lihat="${d.id}">👁️ Lihat Lembar Soal</button>
      </div>`).join('')}`;
  };
  const lihat = d=>{
    isi.innerHTML = `<h1 class="judul">📥 Soal Ujian dari Guru</h1>
      <div class="kartu">
        <div class="barisAtas">
          <button type="button" class="btn kecil" data-kembali="1">⬅️ Kembali</button>
          <h3 style="margin:0">${esc(d.Jenis||'')} — ${esc(d.Mapel||'—')} · Kelas ${esc(d.NamaKelas||'—')}</h3>
          <button type="button" class="btn utama kecil" data-cetak="${d.id}">🖨️ Cetak</button>
        </div>
        <p class="kecil">✍️ ${esc(d.GuruNama||namaGuru(d.GuruEmail)||d.GuruEmail||'—')} · Semester ${esc(d.Semester||'—')} · TA ${esc(d.TahunAjaran||'—')} · ${(d.Soal||[]).length} soal · ${d.Dikumpulkan?'✅ sudah dikumpulkan':'⏳ belum dikumpulkan (masih bisa berubah)'}</p>
      </div>
      <div class="bsKertas serif">${d.Lembar || '<p style="text-align:center;color:#6B7280;margin-top:14px">Guru belum menyusun lembar soal untuk ini.</p>'}</div>`;
  };
  const cetak = d=>{
    const area = el('areaCetak');
    area.className = 'potret';
    area.innerHTML = `<div style="font-family:'Times New Roman',serif;color:#000">${d.Lembar || ''}</div>`;
    window.print();
    area.className = '';
  };
  isi.onclick = async e=>{
    const kl = e.target.closest('[data-kembali]'); if(kl){ await muat(); return; }
    const ct = e.target.closest('[data-cetak]'); if(ct){ const d = daftar.find(x=>x.id===ct.dataset.cetak); if(d) cetak(d); return; }
    const b = e.target.closest('[data-lihat]'); if(!b) return;
    const d = daftar.find(x=>x.id===b.dataset.lihat); if(d) lihat(d);
  };
  await muat();
}

/* ---------- reset ---------- */
async function resetTahunan(){
  const lanjut = await konfirmasi('🔄 RESET TAHUNAN: menghapus SEMUA jadwal, usulan, notifikasi, dan akun guru nonaktif/mutasi. Guru aktif, kelas, mapel & pengaturan waktu TETAP utuh. Soal ujian & arsip bukti TIDAK ikut terhapus. Lanjutkan?');
  if(!lanjut) return;
  const gagal = [];
  for(const nama of ['jadwal','usulan','notifikasi','undangan','jadwal_ujian','pengajuan_ijin','chat_pesan']){
    try{
      const r = await hapusKoleksi(nama);
      if(r.gagal>0) gagal.push(nama);
    }catch(_){ gagal.push(nama); }
  }
  let terhapus = 0, gagalAk = 0;
  try{
    const ak = await getDocs(query(collection(db,'akun_pengguna'), where('SekolahId','==',AKUN.SekolahId)));
    for(const d of ak.docs){
      const a = d.data();
      if(a.Peran==='guru' && a.StatusAkun!=='aktif'){
        try{ await deleteDoc(d.ref); terhapus++; }catch(_){ gagalAk++; }
      }
    }
  }catch(_){ gagalAk = -1; }
  await muatUlangGuru();
  if(gagal.length || gagalAk){
    toast('⚠️ Reset sebagian — gagal menghapus: '+gagal.join(', ')+(gagalAk?' (sebagian akun guru)':'')+'. Pastikan rules v8.3 dipublikasikan lalu ulangi.');
  } else {
    toast(`✅ Reset tahunan selesai — ${terhapus} akun guru nonaktif dihapus`);
  }
}
async function resetPabrik(){
  const yakin1 = await konfirmasi('☣️ RESET SELURUH DATA: sekolah, kelas, mapel, jadwal, usulan, notifikasi, pengumuman, kode pendaftaran, dan seluruh akun pengguna akan dihapus permanen dari Firestore. Lanjutkan?');
  if(!yakin1) return;
  const yakin2 = await konfirmasi('⚠️ KONFIRMASI TERAKHIR: tindakan ini TIDAK BISA dibatalkan. Tetap hapus semuanya?');
  if(!yakin2) return;
  const gagalList = [];
  for(const nama of ['jadwal','jadwal_ujian','usulan','notifikasi','pengumuman','mapel_kelas','mapel_sekolah','pengaturan_waktu','kelas','siswa','sekolah_kunci','kode_pendaftaran','undangan','pengajuan_ijin','guru_biodata','guru_dok','penghitung_nug','ujian_lisan','chat_pesan','soal_ujian']){
    try{
      const r = await hapusKoleksi(nama);
      if(r.gagal>0) gagalList.push(`${nama} (${r.gagal} dokumen)`);
    }catch(_){ gagalList.push(nama); }
  }
  let gagalAk = 0;
  try{
    const ak = await getDocs(collection(db,'akun_pengguna'));
    for(const d of ak.docs){
      if(d.id === AKUN.Email) continue;
      try{ await deleteDoc(d.ref); }catch(_){ gagalAk++; }
    }
  }catch(_){ gagalAk++; }
  try{
    await deleteDoc(doc(db,'sekolah',AKUN.SekolahId));
    await deleteDoc(doc(db,'akun_pengguna',AKUN.Email));
  }catch(err){ gagalList.push('sekolah/akun sendiri'); }

  SETUP = {nama:'', alamat:'', ta:'', jenjang:'SD', logo:''};
  KODE_VALID = '';

  if(gagalList.length || gagalAk){
    try{ await signOut(auth); }catch(_){}
    pesanAuth('⚠️ Reset baru SEBAGIAN — gagal menghapus: '+gagalList.join(', ')+(gagalAk?' akun pengguna':'')+'. Publikasikan rules v8.3 di Firebase Console → Firestore → Rules, lalu masuk kembali dan ulangi reset.');
    return;
  }

  let akunAuthTerhapus = false;
  try{
    await deleteUser(auth.currentUser);
    akunAuthTerhapus = true;
  }catch(err){
    const kode = (err.code||'');
    if(kode.indexOf('requires-recent-login')>-1){
      const sandi = await new Promise(selesai=>modalKunciSandi(selesai));
      if(sandi){
        try{
          const kred = EmailAuthProvider.credential(auth.currentUser.email, sandi);
          await reauthenticateWithCredential(auth.currentUser, kred);
          await deleteUser(auth.currentUser);
          akunAuthTerhapus = true;
        }catch(e2){ toast('⛔ Gagal menghapus akun masuk: '+teksErr(e2)); }
      }
    } else {
      toast('⛔ Gagal menghapus akun masuk: '+teksErr(err));
    }
  }
  if(!akunAuthTerhapus){ try{ await signOut(auth); }catch(_){} }
  pesanAuth(akunAuthTerhapus
    ? '♻️ Seluruh data & akun masuk Anda telah dihapus. Silakan mendaftar ulang dari nol (Operator terlebih dahulu — kode pendaftaran akan dibuat otomatis).'
    : '♻️ Data Firestore telah dihapus bersih. Akun masuk Anda masih ada — hapus di Firebase Console → Authentication → Users bila ingin bersih total, atau langsung daftar ulang dengan e-mail & sandi yang sama.');
}

/* ---------- init ---------- */
async function muatBranding(){
  try{
    const s = await getDocs(collection(db,'sekolah'));
    const d = s.docs[0]?.data();
    el('authLogo').innerHTML = (d && d.LogoSekolah) ? `<img src="${d.LogoSekolah}" alt="Logo sekolah">` : '🏫';
  }catch(_){
    el('authLogo').innerHTML = '🏫';
  }
}
function aman(fn){ try{ fn(); }catch(err){ console.error('Kendala init:', err); } }
aman(()=>{ el('fMasuk').onsubmit = prosesMasuk; });
aman(()=>{ el('btnLonceng').onclick = ()=>{ if(AKUN) lihatNotifikasi(); }; });
aman(()=>{ el('chatFab').onclick = chatBuka; });
aman(()=>{ el('tabMasuk').onclick = ()=> gantiTab('masuk'); });
aman(()=>{ el('tabDaftar').onclick = ()=> gantiTab('daftar'); });
aman(()=>{ el('btnWali').onclick = bukaWali; });
aman(()=>{ el('waliKembali').onclick = tutupWali; });
aman(()=>{ el('btnLupa').onclick = lupaSandi; });
aman(()=>{ document.addEventListener('click', e=>{
  const b = e.target.closest('.mataSandi'); if(!b) return;
  const inp = el(b.dataset.target); if(!inp) return;
  const buka = inp.type === 'password';
  inp.type = buka ? 'text' : 'password';
  b.textContent = buka ? '🙈' : '👁';
}); });
aman(()=>{ muatBranding(); });
window.addEventListener('unhandledrejection', e=>{
  console.error(e.reason);
  try{ toast('⛔ '+teksErr(e.reason)); }catch(_){}
  if(e.preventDefault) e.preventDefault();
});
