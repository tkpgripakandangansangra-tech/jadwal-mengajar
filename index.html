<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembagian Tugas & Jadwal Mengajar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--utama1:#10B981;--latar:#0B1220;--permukaan:#1E293B;--teks:#F1F5F9;--teks2:#94A3B8;--garis:#334155;--bayang:0 2px 10px rgba(0,0,0,.45)}
body{font-family:'Nunito',sans-serif;background:var(--latar);color:var(--teks);min-height:100vh}
h1,h2,h3,.menuBtn,.btn,.tabAuth button{font-family:'Baloo 2',cursive}
input,select,textarea{padding:9px 10px;border:1px solid var(--garis);border-radius:10px;background:#0F172A;color:var(--teks);font-family:'Nunito';font-size:14px;width:100%}
label{display:block;font-size:13px;color:var(--teks2);margin:8px 0 2px}
.btn{border:none;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px;background:#334155;color:#fff;box-shadow:var(--bayang)}
.btn:hover{filter:brightness(1.12)}
.btn.utama{background:linear-gradient(135deg,#064E3B,#10B981);color:#fff}
.btn.sukses{background:linear-gradient(135deg,#064E3B,#34D399);color:#fff}
.btn.bahaya{background:linear-gradient(135deg,#7F1D1D,#EF4444);color:#fff}
.btn.kecil{padding:5px 10px;font-size:12px}
.btn.besar{width:100%;font-size:16px;padding:12px}
.btn:disabled{opacity:.6;cursor:wait}
.btnIkon{background:none;border:none;cursor:pointer;font-size:17px;color:var(--teks)}
.kecil{font-size:12px;color:var(--teks2)}
.judul{margin:0 0 14px;font-size:22px;display:inline-block;padding-bottom:8px;background:linear-gradient(90deg,#10B981,#3B82F6,#8B5CF6) bottom left/100% 6px no-repeat}
.kartu{background:linear-gradient(135deg,#1E293B,#111C33);border:1px solid var(--garis);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--bayang)}
.kartu h3{display:inline-block;background:linear-gradient(90deg,#064E3B,#10B981);color:#fff;border-radius:10px;padding:4px 14px;font-size:15px;margin-bottom:10px}
.barisAtas{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.formBaris{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}
.formBaris label{flex:1;min-width:130px}
.pesan{border-radius:10px;padding:10px;margin:10px 0;font-size:14px;text-align:left}
.pesan.salah{background:#7F1D1D;color:#FECACA}
#toast{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:340px}
#toast div{background:#111827;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:var(--bayang);font-size:14px;animation:muncul .2s}
@keyframes muncul{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
/* ---- layar masuk ---- */
#layarAuth{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0B1220 0%,#1E3A8A 40%,#4C1D95 72%,#064E3B 100%)}
.authKartu{background:linear-gradient(160deg,#0C4A6E 0%,#134E4A 45%,#064E3B 100%);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:28px;width:min(430px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.authLogo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EC4899);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;box-shadow:0 8px 20px rgba(0,0,0,.35);overflow:hidden}
.authLogo img{width:100%;height:100%;object-fit:cover}
.authKartu h1{font-size:21px;margin:6px 0 2px;color:#fff}
.authKartu .kecil{color:rgba(255,255,255,.88)}
.authKartu label{color:rgba(255,255,255,.95)}
.authKartu input,.authKartu select,.authKartu textarea{margin:0 0 14px;background:#0B1220;color:#F8FAFC;font-weight:600;border:2px solid rgba(255,255,255,.28)}
.authKartu input::placeholder{color:#94A3B8;font-weight:400}
.authKartu input:focus,.authKartu select:focus,.authKartu textarea:focus{outline:none;border-color:#F97316;box-shadow:0 0 0 4px #F9731666}
#barisOp{margin-bottom:14px;text-align:left}
.tabAuth{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tabAuth button{flex:1;padding:10px;border-radius:10px;border:none;background:rgba(255,255,255,.15);cursor:pointer;font-size:15px;color:#fff}
.tabAuth button.on{background:linear-gradient(135deg,#F59E0B,#EC4899);color:#fff;font-weight:700}
.authKartu form{text-align:left;margin-top:4px}
.authKartu .pesan.salah{background:rgba(127,29,29,.9);color:#FEE2E2}
.authKartu .btn.utama{background:linear-gradient(135deg,#7C2D12 0%,#F97316 50%,#EC4899 100%);color:#fff;font-size:17px;letter-spacing:.5px;box-shadow:0 8px 20px rgba(236,72,153,.35);transition:transform .15s,filter .15s}
.authKartu .btn.utama:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btnWali{width:100%;margin-top:12px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.45);color:#fff;padding:10px;border-radius:10px;cursor:pointer;font-family:'Nunito';font-size:13.5px}
.btnWali:hover{background:rgba(255,255,255,.24)}
.sandWrap{position:relative;margin:0 0 14px}
.sandWrap input{margin:0;padding-right:40px}
.mataSandi{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:#94A3B8;padding:2px;line-height:1}
.mataSandi:hover{color:#F1F5F9}
.lupaLink{display:block;background:none;border:none;color:#FDE68A;cursor:pointer;font-size:13px;font-family:'Nunito';margin:10px auto 0}
.lupaLink:hover{text-decoration:underline}
.pesan.info{background:#065F46;color:#D1FAE5}
/* ---- mode wali ---- */
#layarWali{min-height:100vh;background:linear-gradient(135deg,#0B1220 0%,#1E3A8A 45%,#064E3B 100%);padding:18px}
.pengumuman{border-left:4px solid #F59E0B;background:rgba(245,158,11,.12);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.pengumuman.penting{border-left-color:#EF4444;background:rgba(239,68,68,.15)}
#atas{flex-wrap:wrap}
#tickerBar{flex:0 0 100%;overflow:hidden;white-space:nowrap;margin-top:6px;padding:5px 12px;border-radius:10px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.15)}
#tickerBar .puLari{display:inline-block;font-size:13px;color:#FDE68A;animation:puJalan linear infinite}
#tickerBar:hover .puLari{animation-play-state:paused}
@keyframes puJalan{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.puGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:800px){.puGrid{grid-template-columns:1fr}}
.waliTop{max-width:860px;margin:0 auto}
.waliTop .barisAtas{justify-content:space-between}
.waliTop .kecil{color:rgba(255,255,255,.75)}
/* ---- aplikasi ---- */
#layarApp{display:flex;min-height:100vh}
#sisi{width:280px;background:linear-gradient(180deg,#064E3B 0%,#1E3A8A 55%,#4C1D95 100%);padding:16px 14px;display:flex;flex-direction:column;box-shadow:var(--bayang);position:sticky;top:0;height:100vh;overflow:hidden;flex-shrink:0}
#sIdent{background:linear-gradient(180deg,#032C20 0%,#064E3B 60%,#0A5C43 100%);margin:-16px -14px 12px;padding:16px 14px 12px;text-align:center;border-bottom:1px solid rgba(255,255,255,.35);box-shadow:0 4px 10px rgba(0,0,0,.35);flex-shrink:0}
.sLogo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#0B1220}
.sLogo.default{display:inline-flex;align-items:center;justify-content:center;font-size:34px}
.fotoWrap{position:relative;width:64px;height:64px;margin:0 auto;cursor:pointer}
.fotoWrap .sLogo{display:block}
.sNama{font-family:'Baloo 2';font-size:15px;margin-top:4px;color:#fff}
#sIdent .kecil{color:rgba(255,255,255,.9)}
#menu{display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;min-height:0;padding-right:2px}
#pengaturanGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
#pengaturanKanan{display:flex;flex-direction:column;gap:18px;min-width:0}
@media(max-width:900px){#pengaturanGrid{grid-template-columns:1fr}}
.menuBtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;font-size:15px;text-align:left;transition:filter .15s,transform .15s;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.menuBtn:hover{filter:brightness(1.15);transform:translateX(2px)}
.menuBtn.aktif{outline:4px solid rgba(255,255,0,1);box-shadow:inset 0 0 0 999px rgba(0,0,0,.58),0 4px 12px rgba(0,0,0,.45)}
.menuBtn.aktif:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.48),0 4px 12px rgba(0,0,0,.45)}
.menuBtn.aktif{text-shadow:0 1px 2px rgba(0,0,0,.9)}
.chip{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
#menu .menuBtn{background:linear-gradient(135deg,#1F2937,#475569)}
#menu .menuBtn[data-modul="guru"]{background:linear-gradient(135deg,#134E4A,#2DD4BF)}
#menu .menuBtn[data-modul="beranda"]{background:linear-gradient(135deg,#064E3B,#10B981)}
#menu .menuBtn[data-modul="susun"]{background:linear-gradient(135deg,#1E3A8A,#3B82F6)}
#menu .menuBtn[data-modul="pelajaran"]{background:linear-gradient(135deg,#14532D,#22C55E)}
#menu .menuBtn[data-modul="kelas"]{background:linear-gradient(135deg,#7C2D12,#F97316)}
#menu .menuBtn[data-modul="laporan"]{background:linear-gradient(135deg,#4C1D95,#8B5CF6)}
#menu .menuBtn[data-modul="pengaturan"]{background:linear-gradient(135deg,#713F12,#EAB308)}
#menu .menuBtn[data-modul="pengumuman"]{background:linear-gradient(135deg,#7F1D1D,#EF4444)}
#menu .menuBtn[data-modul="dokumentasi"]{background:linear-gradient(135deg,#0C4A6E,#38BDF8)}
#menu .menuBtn[data-modul="usulan"]{background:linear-gradient(135deg,#831843,#EC4899)}
#menu .menuBtn[data-modul="jadwalSaya"]{background:linear-gradient(135deg,#134E4A,#2DD4BF)}
#menu .menuBtn[data-modul="notifikasiSaya"]{background:linear-gradient(135deg,#164E63,#06B6D4)}
#menu .menuBtn[data-modul="ujian"]{background:linear-gradient(135deg,#831843,#DB2777)}
#menu .menuBtn[data-modul="keluar"]{background:linear-gradient(135deg,#1F2937,#475569)}
#kolomUtama{flex:1;min-width:0}
#atas{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:linear-gradient(90deg,#064E3B,#1E3A8A);box-shadow:var(--bayang);position:sticky;top:0;z-index:40}
#atasSekolah{text-align:left;flex:1;min-width:0}
.atasKop{display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.atasLogo{width:57px;height:57px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.15);flex-shrink:0}
.atasLogo.default{display:flex;align-items:center;justify-content:center;font-size:29px}
.atasBaris1{font-family:'Baloo 2';font-size:24px;font-weight:700;color:#fff;line-height:1.15}
.atasBaris2{font-size:16px;color:rgba(255,255,255,.92)}
.atasBaris3{font-size:16px;font-weight:600;color:#FDE68A}
#atas .btnIkon{color:#fff}
#isi{padding:18px;max-width:1050px}
.badge{background:#EF4444;color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;position:relative;top:-8px;left:-4px}
/* ---- beranda ---- */
.statBaris{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:120px;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--bayang);color:#fff}
.stat span{font-size:24px}
.stat b{display:block;font-size:22px}
.stat:nth-child(1){background:linear-gradient(135deg,#064E3B,#10B981)}
.stat:nth-child(2){background:linear-gradient(135deg,#1E3A8A,#3B82F6)}
.stat:nth-child(3){background:linear-gradient(135deg,#713F12,#EAB308)}
.stat:nth-child(4){background:linear-gradient(135deg,#4C1D95,#8B5CF6)}
/* ---- susun jadwal ---- */
.chipHari{border:1px solid var(--garis);background:#0F172A;color:var(--teks2);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:'Nunito';font-size:13px;margin:2px}
.chipHari.on{background:linear-gradient(135deg,#1E3A8A,#3B82F6);color:#fff;border-color:transparent}
.istTag{display:inline-block;background:#713F1280;border:1px solid #EAB30866;color:#FDE68A;border-radius:999px;padding:3px 10px;font-size:12px;margin:2px}
.istTag button{background:none;border:none;cursor:pointer;color:inherit}
.istBaris{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
.istBaris input,.istBaris select{width:auto;padding:5px 6px}
.istBaris .btnIkon{font-size:14px;color:#F87171}
.mapelBaris{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:6px;background:linear-gradient(90deg,#10B9811F,#3B82F61F);border-radius:10px;cursor:pointer;flex-wrap:wrap}
.mapelBaris.terpilih{outline:2px solid #34D399}
.inNama{flex:2;min-width:120px;text-transform:uppercase}.inJP{width:70px}.inGuru{flex:1;min-width:150px}
.barProgres{flex:1;min-width:80px;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.barProgres div{height:100%}
.gridJadwal{width:100%;border-collapse:collapse;margin-top:10px;table-layout:fixed}
.gridJadwal th,.gridJadwal td{border:1px solid var(--garis);padding:5px;text-align:center;font-size:12px;overflow:hidden}
.gridJadwal th{background:linear-gradient(135deg,#1E3A8A,#0EA5E9);color:#fff}
.gridJadwal td.terisi{cursor:pointer;font-weight:700}
.gridJadwal td.terisi span{display:block;font-weight:400;font-size:11px}
.gridJadwal td.kosong{cursor:pointer;color:var(--teks2);font-size:18px;background:#EAB3081F}
.gridJadwal td.mati{background:#0B1220;color:#475569}
.totalJp{background:linear-gradient(135deg,#1E3A8A44,#10B98144);border:1px solid var(--garis);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.totalJp b{font-size:22px;font-family:'Baloo 2'}
.istRowCell{background:#713F1280;color:#FDE68A;text-align:center;font-size:12px;padding:4px}
.waktuCol{background:linear-gradient(135deg,#1E3A8A,#0EA5E9);color:#fff;text-align:center;font-size:12px}
.gridJadwal .hariIni{box-shadow:inset 0 0 0 2px #F59E0B}
.gridJadwal td.bentrok{outline:2px solid #EF4444}
.gridJadwal td[draggable="true"]{cursor:grab}
.gridJadwal td.sorotSeret{outline:2px dashed #34D399;outline-offset:-2px}
.peringatan{background:#78350F;color:#FEF3C7;border-radius:10px;padding:10px;margin:10px 0;font-size:13px}
.chipStatus{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.chipMapel{display:inline-block;background:#3B82F633;border:1px solid #3B82F666;color:var(--teks);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px}
.tabelMini{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tabelMini th,.tabelMini td{border:1px solid var(--garis);padding:5px 8px;text-align:left}
.tabelMini th{background:linear-gradient(135deg,#4C1D95,#7C3AED);color:#fff}
.geserX{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
/* ---- obrolan ---- */
#chatFab{position:fixed;right:16px;bottom:16px;z-index:120;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:25px;background:linear-gradient(135deg,#1E3A8A,#3B82F6);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#chatFab:hover{filter:brightness(1.15)}
#chatPanel{position:fixed;right:12px;bottom:12px;z-index:120;width:min(380px,95vw);height:min(580px,80vh);background:var(--permukaan);border:1px solid var(--garis);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6);overflow:hidden}
#chatKepala{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#064E3B,#1E3A8A);color:#fff;flex-shrink:0}
#chatKepala .ujTab{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:12px}
#chatKepala .ujTab.on{background:linear-gradient(135deg,#F59E0B,#EC4899);font-weight:700}
#chatIsi{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.chatMsg{max-width:86%;width:fit-content;border-radius:12px;padding:7px 10px;font-size:13.5px;background:#0F172A;border:1px solid var(--garis);align-self:flex-start}
.chatTeks{white-space:pre-wrap;word-break:break-word}
.chatMsg.aku{align-self:flex-end;background:linear-gradient(135deg,#065F46,#0F766E);border-color:transparent}
.chatMsg.keputusan{background:linear-gradient(135deg,#713F12,#EAB308);color:#1C1917;border-color:transparent}
.chatFoto{width:100%;max-width:240px;border-radius:8px;display:block;margin:4px 0;cursor:zoom-in}
.chatAudio audio{width:210px;max-width:100%;height:34px;margin:4px 0}
.chatBaris{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;background:none;border:none;text-align:left;color:inherit}
.chatBaris:hover{background:rgba(59,130,246,.12)}
.chatAva{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:linear-gradient(135deg,#1E3A8A,#3B82F6);color:#fff}
.cbInfo{flex:1;min-width:0}
.cbNama{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbSub{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nBadge{background:#EF4444;color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.chatRekTitik{width:10px;height:10px;border-radius:50%;background:#EF4444;display:inline-block;animation:chatKedip 1s infinite}
@keyframes chatKedip{0%,100%{opacity:1}50%{opacity:.2}}
#chatBar{display:flex;gap:6px;padding:8px;border-top:1px solid var(--garis);align-items:center;flex-shrink:0;flex-wrap:wrap}
#chatBar input[type=text]{flex:1;min-width:120px;margin:0}
.btnTeks{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;text-decoration:underline;padding:0}
.arItem{width:150px;flex-shrink:0}
.arItem img{width:100%;border-radius:8px;cursor:zoom-in;display:block;margin-bottom:4px}
.arItem audio{width:100%;height:36px;margin-bottom:4px}
.notifItem{padding:8px;border-bottom:1px solid var(--garis);font-size:14px}
.notifItem.baru{border-left:4px solid #34D399;background:rgba(16,185,129,.12)}
.barisTombol{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.logoPrev{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:8px 0}
.kodeBox{font-family:'Baloo 2';font-size:28px;letter-spacing:3px;background:linear-gradient(135deg,#1E3A8A44,#10B98144);border-radius:12px;padding:14px;margin:12px 0;text-align:center}
.ujBaris{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:6px;background:linear-gradient(90deg,#8B5CF61F,#EC48991F);border-radius:10px;flex-wrap:wrap}
.ujBaris input,.ujBaris select{width:auto}
.ujMapel{flex:1;min-width:130px;font-weight:700}
/* ---- modal ---- */
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:80}
.modal{background:linear-gradient(160deg,#1E293B,#111C33);border:1px solid var(--garis);border-radius:16px;padding:20px;width:min(480px,92vw);max-height:86vh;overflow:auto}
.modal h3{display:inline-block;background:linear-gradient(90deg,#1E3A8A,#10B981);color:#fff;border-radius:10px;padding:4px 14px;font-size:16px;margin-bottom:10px}
.modalTombol{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* ---- ijin & pengganti ---- */
.ijinBaris{border:1px solid var(--garis);border-radius:10px;padding:10px;margin:8px 0;background:linear-gradient(90deg,#0EA5E91F,#EAB3081F)}
.sesiChip{display:inline-block;background:#0EA5E922;border:1px solid #0EA5E955;color:var(--teks);border-radius:8px;padding:4px 8px;font-size:12px;margin:2px}
.sesiChip.pengganti{background:#10B98122;border-color:#10B98166}

/* ---------- util ---------- */

const esc = s => (s??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  p.classList.toggle('info', sukses===true);

function teksErr(e){
  const c = (e&&e.code)||''; const m = (e&&e.message)||String(e);
  if(c.indexOf('permission-denied')>-1 || m.indexOf('permission-denied')>-1) return 'Akses Firestore ditolak — periksa rules v8.3 di Firebase Console.';
  if(c.indexOf('invalid-credential')>-1 || c.indexOf('wrong-password')>-1 || c.indexOf('user-not-found')>-1) return 'E-mail atau sandi salah.';
  if(c.indexOf('email-already-in-use')>-1) return 'E-mail sudah dipakai — sistem akan melengkapi pendaftaran otomatis.';
  if(c.indexOf('weak-password')>-1) return 'Sandi minimal 6 karakter.';
  if(c.indexOf('invalid-email')>-1) return 'Format e-mail tidak valid.';
  if(c.indexOf('unavailable')>-1 || m.indexOf('Waktu tunggu')>-1) return 'Koneksi ke server gagal — periksa internet Anda.';
  return m;
}
function denganBatas(p, ms=30000){
  return Promise.race([p, new Promise((_,tolak)=>setTimeout(()=>tolak(new Error('Waktu tunggu habis — periksa koneksi internet, lalu coba lagi.')), ms))]);
}
function taDefault(){
  const d = new Date(), y = d.getFullYear();
  return (d.getMonth()+1) >= 7 ? y+'/'+(y+1) : (y-1)+'/'+y;
}
function menitKeAngka(jam){ const p=(jam||'07:15').split(':'); return Number(p[0])*60+Number(p[1]); }
function angkaKeMenit(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function hitungSlot(pw){
  const totalJP = Number(pw.JumlahJP)||10;
  const durasi = Number(pw.DurasiJP)||35;
  const rel = new Map((pw.Istirahat||[]).filter(x=>x.SetelahJP && !x.Mulai).map(x=>[Number(x.SetelahJP), Number(x.Menit)||15]));
  const tetap = (pw.Istirahat||[]).filter(x=>x.Mulai && x.Selesai)
    .map(x=>({Mulai:menitKeAngka(x.Mulai), Selesai:menitKeAngka(x.Selesai), dipakai:false})).sort((a,b)=>a.Mulai-b.Mulai);
  let t = menitKeAngka(pw.JamMasuk);
  const hasil = [];
  for(let i=1; i<=totalJP; i++){
    for(const br of tetap){
      if(br.dipakai) continue;
      if(br.Selesai > t && br.Mulai < t + durasi){
        br.dipakai = true;
        t = Math.max(t, br.Selesai);
      }
    }
    hasil.push({NoJP:i, Mulai:angkaKeMenit(t), Selesai:angkaKeMenit(t+durasi)});
    t += durasi;
    if(rel.has(i)) t += rel.get(i);
  }
  return hasil;
}
function chipStatus(s){
  const m = {menunggu:['⏳ Menunggu keputusan KS','#F59E0B'], disetujui:['✅ Disetujui KS','#10B981'], ditolak:['❌ Ditolak','#EF4444'], revisi:['✏️ Perlu revisi','#F97316'], diterbitkan:['📢 Diterbitkan','#3B82F6'], draf:['✏️ Draf','#94A3B8']};
  const x = m[s]||['—','#94A3B8'];
  return `<span class="chipStatus" style="background:${x[1]}22;color:${x[1]}">${x[0]}</span>`;
}
function labelPeran(p){ return {operator:'Operator', kepala_sekolah:'Kepala Sekolah', guru:'Guru'}[p]||p; }
function namaGuru(em){ const g = GURU.find(x=>(x.EmailPengguna||'')===em); return g ? g.NamaPengguna : ''; }
function namaKs(){ const k = GURU.find(g=>g.Peran==='kepala_sekolah'); return k ? k.NamaPengguna : ''; }
function namaOp(){ const o = GURU.find(g=>g.Peran==='operator'); return o ? o.NamaPengguna : ''; }
function angkaRomawi(s){
  if(!s) return null;
  const t = s.toUpperCase();
  if(!/^[IVXL]+$/.test(t)) return null;
  const map = {I:1,V:5,X:10,L:50};
  let n = 0;
  for(let i=0;i<t.length;i++){
    const v = map[t[i]], vn = map[t[i+1]]||0;
    n += v < vn ? -v : v;
  }
  return n;
}
function urutKelas(a,b){
  const ka = (((a.NamaKelas||'').trim().split(/\s+/))[0])||'', kb = (((b.NamaKelas||'').trim().split(/\s+/))[0])||'';
  const na = angkaRomawi(ka), nb = angkaRomawi(kb);
  if(na!==null && nb!==null && na!==nb) return na-nb;
  return (a.NamaKelas||'').localeCompare(b.NamaKelas||'');
}
async function ambilKelas(){
  const s = await getDocs(query(collection(db,'kelas'), where('SekolahId','==',AKUN.SekolahId)));
  return s.docs.map(d=>({id:d.id,...d.data()})).sort(urutKelas);
}
async function ambilAtauKosong(ref){
  try{ const s = await getDoc(ref); return s.exists() ? s.data() : null; }catch(_){ return null; }
}
async function hapusKoleksi(nama){
  const snap = await getDocs(collection(db,nama));
  let gagal = 0;
  await Promise.all(snap.docs.map(d=>deleteDoc(d.ref).catch(()=>{gagal++;})));
  return {total:snap.size, gagal};
}
async function buatKodeBaru(){
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  for(let coba=0; coba<12; coba++){
    let s = '';
    for(let i=0;i<8;i++) s += A[Math.floor(Math.random()*A.length)];
    const kode = s.slice(0,4)+'-'+s.slice(4);
    if(!(await getDoc(doc(db,'kode_pendaftaran',kode))).exists()) return kode;
  }
  throw new Error('Gagal membuat kode — coba lagi.');
}
function tabelJadwalMini(cells){
  if(!cells.length) return '<p class="kecil">Tidak ada sel terpasang.</p>';
  const perHari = {};

  let h = '<table class="tabelMini"><tr><th>Hari</th><th>JP</th><th>Waktu</th><th>Mata Pelajaran</th><th>Guru</th></tr>';
  for(const hr of HARI){
    (perHari[hr]||[]).sort((a,b)=>a.NoJP-b.NoJP).forEach(c=>{
      h += `<tr><td>${hr}</td><td>${c.NoJP}</td><td>${esc(c.Waktu||'')}</td><td><b style="color:${c.Warna||'inherit'}">${esc(c.NamaMapel||'')}</b></td><td>${esc(c.GuruNama||'')}</td></tr>`;
    });
  }
  return h+'</table>';
}

function kopAlamat(alamat){
  const a = (alamat||'').trim();
  if(!a) return '';
  const desa = (a.match(/desa\s+([\w. ]+?)(?=\s*(?:kec|kab|dusun|rt|rw|jatim|provinsi|propinsi|\d|$))/i)||[])[1];
  const kec = (a.match(/kec(?:amatan)?.?\s+([\w. ]+?)(?=\s*(?:kab|jatim|provinsi|propinsi|\d|$))/i)||[])[1];
  const kab = (a.match(/kab(?:upaten)?.?\s+([\w. ]+?)(?=\s*(?:jatim|provinsi|propinsi|\d|$))/i)||[])[1];
  const bagus = [desa, kec&&('Kec. '+kec), kab&&('Kab. '+kab)].filter(Boolean).join(' ');
  return bagus || a;
}
async function gridStatis(kelasId, cells, sorotHari, untukGuru){
  let pw = {...PW_DEFAULT};
  try{ const s = await getDoc(doc(db,'pengaturan_waktu',kelasId)); if(s.exists()) pw = {...pw, ...s.data()}; }catch(_){}
  const slots = hitungSlot(pw);
  const hariAktif = pw.HariAktif||[];
  const per = {};
  cells.forEach(c=>{ (per[c.Hari]=per[c.Hari]||{})[Number(c.NoJP)] = c; });
  const sisip = new Map();
  for(const x of pw.Istirahat||[]){
    if(x.Mulai && x.Selesai){
      const mSel = menitKeAngka(x.Selesai);
      const idx = slots.findIndex(s=>menitKeAngka(s.Mulai) >= mSel);
      const lbl = `☕ istirahat ${x.Mulai}–${x.Selesai}`;
      if(idx>=0) sisip.set('sebelum:'+slots[idx].NoJP, lbl); else sisip.set('akhir', lbl);
    } else {
      const k = Number(x.SetelahJP);
      const idx = slots.findIndex(s=>s.NoJP===k);
      if(idx>=0 && idx<slots.length-1) sisip.set('sebelum:'+slots[idx+1].NoJP, `☕ istirahat ${x.Menit}′`);
    }
  }
  let h = '<table class="gridJadwal"><tr><th style="width:110px">JP / Waktu</th>' + HARI.map(hr=>`<th${hr===sorotHari?' class="hariIni"':''}>${hr}</th>`).join('') + '</tr>';
  for(const s of slots){
    const lbl = sisip.get('sebelum:'+s.NoJP);
    if(lbl) h += `<tr><td colspan="${HARI.length+1}" class="istRowCell">${lbl}</td></tr>`;
    h += `<tr><td class="waktuCol"><b>${s.NoJP}</b><br><span style="font-size:11px;font-weight:400">${s.Mulai}–${s.Selesai}</span></td>`;
    for(const hr of HARI){
      const sorot = hr===sorotHari ? ' hariIni' : '';
      const j = per[hr] && per[hr][s.NoJP];
      if(j) h += `<td class="terisi${sorot}" style="background:${j.Warna||'#94A3B8'}26"><b>${esc(j.NamaMapel||'')}</b><span>${esc(untukGuru ? (j.NamaKelas||'') : (j.GuruNama||''))}</span></td>`;
      else if(hariAktif.includes(hr)) h += `<td class="kosong${sorot}">&nbsp;</td>`;
      else h += `<td class="mati${sorot}">–</td>`;
    }
    h += '</tr>';
  }
  const akhir = sisip.get('akhir');
  if(akhir) h += `<tr><td colspan="${HARI.length+1}" class="istRowCell">${akhir}</td></tr>`;
  return h+'</table>';
}
function cetakJadwal(judul, isiTabel, kananLabel, kananNama){
  const alamatKop = kopAlamat(SEKOLAH.AlamatSekolah);
  const kec = (alamatKop.match(/Kec. ([\w. ]+?)(?= Kab.|$)/)||[])[1] || '';
  const tgl = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  el('areaCetak').innerHTML = `
    <div class="kop">${SEKOLAH.LogoSekolah ? `<img src="${SEKOLAH.LogoSekolah}">` : ''}
      <div class="kopTeks"><h2>${esc(SEKOLAH.NamaSekolah||'')}</h2>
      <div>${esc(alamatKop)}</div>
      <div>Tahun Ajaran ${esc(SEKOLAH.TahunAjaran||'')}</div></div></div>
    <h3 class="cetakJudul">${esc(judul)}</h3>${isiTabel}
    <div class="ttdWrap">
      <div class="ttd"><div>${kec ? esc(kec)+', ' : ''}${tgl}</div><div>${esc(kananLabel)}</div><div class="ruangTtd"></div><div><b>${esc(kananNama||'………………………')}</b></div></div>
    </div>`;
  window.print();
}
function unduhCsv(namaFile, baris){
  const csv = '\uFEFF' + baris.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const b = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = namaFile; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

async function daftarKirim(){
  const email = norm(el('dvEmail').value);
  const sandi = el('dvSandi').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ pesanAuth('⛔ Format e-mail belum benar.'); return; }
  if(EMAIL_SEKALI_PAKAI.has(email.split('@')[1]||'')){ pesanAuth('⛔ E-mail sekali-pakai ditolak — gunakan e-mail aktif Anda.'); return; }
  if(sandi.length < 6){ pesanAuth('⛔ Kata sandi minimal 6 karakter.'); return; }
  const b = el('dvBtn'); b.disabled = true; b.textContent = '⏳ Memproses…';
  pesanAuth('');
  sedangMendaftar = true; GERBANG_ANTI++;
  try{
    let u;
    try{ u = (await createUserWithEmailAndPassword(auth, email, sandi)).user; }
    catch(err){
      if((err.code||'').indexOf('email-already-in-use')>-1){
        try{ u = (await signInWithEmailAndPassword(auth, email, sandi)).user; }
        catch(e2){ throw new Error('E-mail ini sudah dipakai dengan sandi lain. Jika ini e-mail Anda, Masuk dengan sandi lama.'); }
      } else throw err;
    }
    DAFTAR.email = email; DAFTAR.sandi = sandi; DAFTAR.u = u;
    if(u.emailVerified){ sedangMendaftar = false; await daftarLanjut(); return; }
    await denganBatas(sendEmailVerification(u), 20000);
    sedangMendaftar = false;
    daftarTunggu();
  }catch(err){
    sedangMendaftar = false;
    try{ await signOut(auth); }catch(_){}
    pesanAuth('⛔ '+teksErr(err));
  }finally{
    const bb = el('dvBtn');
    if(bb){ bb.disabled = false; bb.textContent = '🔐 Kirim Tautan Verifikasi'; }
  }
}

async function daftarCek(){
  const u = auth.currentUser; if(!u) return;
  try{ await u.reload(); }catch(_){}

    if(DAFTAR.poll){ clearInterval(DAFTAR.poll); DAFTAR.poll = null; }
    DAFTAR.u = u;
    toast('✅ E-mail terverifikasi — melanjutkan pendaftaran…');
    await daftarLanjut();
  }
}

async function daftarOperator(){
  const nama = el('dNama').value.trim();

  if(!nama){ pesanAuth('⛔ Isi nama lengkap Anda.'); return; }
  if(!namaSekolah){ pesanAuth('⛔ Isi nama sekolah.'); return; }
  if(!/^\d{4}\/\d{4}$/.test(ta)){ pesanAuth('⛔ Tahun ajaran harus berformat 2026/2027.'); return; }
  const b = el('dSetupSimpan'); b.disabled = true; b.textContent = '⏳ Menyimpan…';
  sedangMendaftar = true; GERBANG_ANTI++;
  try{
    const u = auth.currentUser;
    if(!u || !u.emailVerified) throw new Error('Sesi verifikasi berubah — ulangi dari tab Daftar.');
    const email = norm(u.email);
    await setDoc(doc(db,'akun_pengguna',email), {NamaPengguna:nama, EmailPengguna:email, Peran:'operator', SekolahId:'SEKOLAH', StatusAkun:'aktif', DibuatPada:serverTimestamp()});

    const j = el('dJenjang').value;
    const dk = j==='SD' ? ['I','II','III','IV','V','VI'] : j==='SMP' ? ['VII','VIII','IX'] : j==='Pondok Pesantren' ? ['VII','VIII','IX','X','XI','XII'] : ['X','XI','XII'];
    for(let i=0;i<dk.length;i++){
      await setDoc(doc(db,'kelas','SEKOLAH_K'+(i+1)), {SekolahId:'SEKOLAH', NamaKelas:dk[i], TahunAjaran:ta, Urutan:i+1});
    }
    const kodeDibuat = await buatKodeBaru();
    await setDoc(doc(db,'kode_pendaftaran',kodeDibuat), {SekolahId:'SEKOLAH', DibuatPada:serverTimestamp(), DibuatOleh:nama});
    sedangMendaftar = false;
    await mulaiSesi(u);
    bukaModal('🎉 Sekolah berhasil didirikan!',
      `<p>Sekolah <b>${esc(namaSekolah)}</b> kini aktif.</p>
       <p>Kode Pendaftaran sekolah Anda:</p>
       <div class="kodeBox">${kodeDibuat}</div>
       <p class="kecil">Bagikan kode ini kepada Kepala Sekolah &amp; Guru agar bisa mendaftar. Jangan berikan kepada wali murid. Kode selalu bisa dilihat/diganti di menu Pengaturan.</p>`,
      [{label:'Mulai'}]);
  }catch(err){
    sedangMendaftar = false;
    pesanAuth('⛔ '+teksErr(err));
    toast('⛔ '+teksErr(err));
  }finally{
    const bb = el('dSetupSimpan');
    if(bb){ bb.disabled = false; bb.textContent = '💾 Daftar & Dirikan Sekolah'; }
  }
}

let notifAudio = null, notifBelTimer = null;
function notifBunyi(){
  try{
    notifAudio = notifAudio || new (window.AudioContext||window.webkitAudioContext)();
    if(notifAudio.state==='suspended') notifAudio.resume();
    const t0 = notifAudio.currentTime;
    [784, 1046.5, 1318.5].forEach((f,i)=>{
      const o = notifAudio.createOscillator(), g = notifAudio.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t0+i*0.16);
      g.gain.exponentialRampToValueAtTime(0.22, t0+i*0.16+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.16+0.8);
      o.connect(g); g.connect(notifAudio.destination);
      o.start(t0+i*0.16); o.stop(t0+i*0.16+0.85);
    });
  }catch(_){}
}
function notifBel(belumDibaca){
  if(belumDibaca>0){
    if(notifBelTimer) return;
    const dering = ()=>{ const bg = el('modalBg'); if(bg && !bg.hidden) return; notifBunyi(); };
    dering();
    notifBelTimer = setInterval(dering, 10000);
  } else if(notifBelTimer){ clearInterval(notifBelTimer); notifBelTimer = null; }
}

async function chatSuaraMulai(){
  if(CHAT.rek) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast('⛔ Browser ini belum mendukung perekaman suara — coba Chrome/Edge terbaru'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder.isTypeSupported(t)) || '';
    const rec = new MediaRecorder(stream, mime?{mimeType:mime, audioBitsPerSecond:24000}:undefined);
    const chunks = [];
    rec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    CHAT.rek = {rec, chunks, mulai:Date.now(), timer:null, stream, ruang:chatRuang()};
    rec.start(500);
    CHAT.rek.timer = setInterval(()=>{
      if(!CHAT.rek) return;
      const d = Math.floor((Date.now()-CHAT.rek.mulai)/1000);
      const w = el('chatRekWaktu'); if(w) w.textContent = Math.floor(d/60)+':'+String(d%60).padStart(2,'0');
      if(d>=60){ toast('⏱ Maksimal 1 menit — pesan suara dikirim otomatis'); chatSuaraKirim(); }
    }, 250);
    chatGambar();
  }catch(err){ toast('⛔ Mikrofon tidak bisa diakses'+(err&&err.name?' ('+err.name+')':'')+' — izinkan mikrofon di browser'); }
}
async function chatSuaraStop(){
  const rek = CHAT.rek; if(!rek) return null;
  if(rek.timer) clearInterval(rek.timer);
  try{ rek.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
  await new Promise(res=>{ rek.rec.onstop = res; try{ if(rek.rec.state!=='inactive') rek.rec.stop(); else res(); }catch(_){ res(); } });
  CHAT.rek = null;
  const blob = new Blob(rek.chunks, {type: rek.rec.mimeType||'audio/webm'});
  return {blob, detik: Math.round((Date.now()-rek.mulai)/1000), ruang: rek.ruang};
}
async function chatSuaraBatal(){
  if(!CHAT.rek) return;
  await chatSuaraStop();
  toast('Rekaman dibuang'); chatGambar();
}
async function chatSuaraKirim(){
  const hasil = await chatSuaraStop();
  if(!hasil){ chatGambar(); return; }
  if(hasil.detik < 1){ toast('Perekaman terlalu pendek'); chatGambar(); return; }
  const dataUrl = await new Promise(res=>{ const r = new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(''); r.readAsDataURL(hasil.blob); });
  if(!dataUrl){ toast('⛔ Gagal memproses suara'); chatGambar(); return; }
  if(dataUrl.length > 900000){ toast('⛔ Suara terlalu besar — batas ±1 menit'); chatGambar(); return; }
  const ruang = hasil.ruang || chatRuang();

function chatMasuk(){
  let terbesar = 0;
  CHAT.semua.forEach(m=>{ const t = (m.DibuatPada?.seconds)||0; if(t>terbesar) terbesar = t; });
  const dariOrang = terbesar>0 && CHAT.semua.some(m=>((m.DibuatPada?.seconds)||0)===terbesar && m.PengirimEmail!==AKUN.Email);
  if(terbesar>CHAT.lastTs){
    if(dariOrang && !CHAT.buka) notifBunyi();
    CHAT.lastTs = terbesar;
  }
  if(CHAT.buka) chatGambar(); else chatBadge();
}

async function bukaKelas(kelasId){
  SK = {kelasId, kelas:SK.daftarKelas.find(k=>k.id===kelasId)||{NamaKelas:''}, daftarKelas:SK.daftarKelas, pw:null, mapel:[], jadwal:[], semua:[], usulan:null, terpilih:null};
  const [pwS, mpS, jS, smS] = await Promise.all([
    getDoc(doc(db,'pengaturan_waktu',kelasId)),
    getDocs(query(collection(db,'mapel_kelas'), where('SekolahId','==',AKUN.SekolahId), where('KelasId','==',kelasId))),
    getDocs(query(collection(db,'jadwal'), where('SekolahId','==',AKUN.SekolahId), where('KelasId','==',kelasId))),
    getDocs(query(collection(db,'jadwal'), where('SekolahId','==',AKUN.SekolahId)))
  ]);
  SK.pw = {...PW_DEFAULT, ...(pwS.exists()?pwS.data():{})};
  SK.pw.Slots = hitungSlot(SK.pw);
  SK.mapel = mpS.docs.map(d=>({idDoc:d.id,...d.data()})).sort((a,b)=>(a.Urutan||0)-(b.Urutan||0));
  SK.jadwal = jS.docs.map(d=>({idDoc:d.id,...d.data()}));
  SK.semua = smS.docs.map(d=>d.data());
  SK.usulan = await ambilAtauKosong(doc(db,'usulan',kelasId));
  renderPanel();
}

function wirePanel(){
  el('pwHari').onclick = e=>{
    const c = e.target.closest('.chipHari'); if(!c) return;
    const h = c.dataset.h, arr = SK.pw.HariAktif||[];
    SK.pw.HariAktif = arr.includes(h) ? arr.filter(x=>x!==h) : [...arr, h];
    renderChipsHari();
  };
  el('pwIst').onclick = e=>{
    const t = e.target.closest('[data-ist]'); if(!t) return;
    SK.pw.Istirahat.splice(Number(t.dataset.ist),1); renderIst();
  };
  el('pwTambahIst').onclick = ()=>{ (SK.pw.Istirahat=SK.pw.Istirahat||[]).push({SetelahJP:3,Menit:15}); renderIst(); };
  el('pwTambahIstTetap').onclick = ()=>{ (SK.pw.Istirahat=SK.pw.Istirahat||[]).push({Mulai:'09:30',Selesai:'09:45'}); renderIst(); };
  el('pwIst').onchange = e=>{
    const baris = e.target.closest('[data-i]'); if(!baris) return;
    const i = Number(baris.dataset.i), f = e.target.dataset.f; if(!f) return;
    if(f==='Mode'){
      SK.pw.Istirahat[i] = e.target.value==='tetap'
        ? {Mulai:baris.querySelector('[data-f="Mulai"]').value||'09:30', Selesai:baris.querySelector('[data-f="Selesai"]').value||'09:45'}
        : {SetelahJP:Number(baris.querySelector('[data-f="SetelahJP"]').value)||3, Menit:Number(baris.querySelector('[data-f="Menit"]').value)||15};
      renderIst();
    } else {
      SK.pw.Istirahat[i][f] = (f==='SetelahJP'||f==='Menit') ? Number(e.target.value)||0 : e.target.value;
    }
  };
  el('pwSimpan').onclick = simpanWaktu;
  el('btnKirimUsulan').onclick = kirimUsulan;
  el('btnTerbitkan').onclick = terbitkan;
  el('daftarMapel').onclick = e=>{
    if(e.target.closest('input,select,button')) return;
    const baris = e.target.closest('[data-i]');
    if(baris){ const i = Number(baris.dataset.i); SK.terpilih = SK.terpilih===i ? null : i; renderMapel(); }
  };
  el('gridWrap').onclick = async e=>{
    const c = e.target.closest('td[data-hari]'); if(!c) return;
    const hari = c.dataset.hari, nojp = Number(c.dataset.nojp);
    try{
      if(SK.terpilih === null) await kosongkanSel(hari, nojp);
      else await pasangSel(hari, nojp);
    }catch(err){ toast('⛔ '+teksErr(err)); }
  };
}
async function simpanWaktu(){
  const b = el('pwSimpan'); b.disabled = true;
  try{
    SK.pw.JamMasuk = el('pwJam').value || '07:15';
    SK.pw.DurasiJP = Number(el('pwDurasi').value)||35;
    SK.pw.JumlahJP = Math.max(1, Math.min(16, Number(el('pwJumlah').value)||10));
    SK.pw.Istirahat = (SK.pw.Istirahat||[]).filter(x=> (x.Mulai && x.Selesai) || (Number(x.SetelahJP)>=1 && Number(x.SetelahJP)<=SK.pw.JumlahJP));
    SK.pw.Slots = hitungSlot(SK.pw);
    await setDoc(doc(db,'pengaturan_waktu',SK.kelasId), {JamMasuk:SK.pw.JamMasuk, DurasiJP:SK.pw.DurasiJP, JumlahJP:SK.pw.JumlahJP, HariAktif:SK.pw.HariAktif, Istirahat:SK.pw.Istirahat, Slots:SK.pw.Slots});
    for(const j of [...SK.jadwal]){
      const sl = SK.pw.Slots.find(s=>s.NoJP===Number(j.NoJP));
      const valid = sl && (SK.pw.HariAktif||[]).includes(j.Hari);
      if(!valid){
        await deleteDoc(doc(db,'jadwal',j.idDoc));
        SK.jadwal = SK.jadwal.filter(x=>x!==j);
      } else {
        const wkt = `${sl.Mulai}–${sl.Selesai}`;
        if(j.Waktu !== wkt){ await updateDoc(doc(db,'jadwal',j.idDoc),{Waktu:wkt}); j.Waktu = wkt; }
      }
    }
    segarkanSemua();
    toast('✅ Pengaturan waktu tersimpan');
    renderChipsHari(); renderIst(); renderMapel(); renderGridPeringatan();
  }catch(err){ toast('⛔ '+teksErr(err)); }
  finally{ b.disabled = false; }
}
function renderMapel(){
  const w = el('daftarMapel');
  w.innerHTML = SK.mapel.map((m,i)=>{
    const pasang = SK.jadwal.filter(j=>j.NamaMapel===m.Nama).length;
    const target = Number(m.JP)||1;
    const pct = Math.min(100, Math.round(pasang*100/target));
    const penuh = pasang >= target;
    return `<div class="mapelBaris ${SK.terpilih===i?'terpilih':''}" data-i="${i}" style="border-left:6px solid ${m.Warna||'#94A3B8'}" title="Klik untuk memilih/kosongkan pilihan">
      <b class="inNama" style="color:${m.Warna||'inherit'};align-self:center">${esc(m.Nama)}</b>
      <span class="kecil inJP" style="align-self:center" title="Target JP/minggu (atur di Daftar Pelajaran)">🎯 ${target} JP</span>
      <span class="kecil inGuru" style="align-self:center" title="Guru pengampu (atur di Daftar Pelajaran)">👨‍🏫 ${esc(m.GuruNama||'tanpa guru')}</span>
      <div class="barProgres"><div style="width:${pct}%;background:${penuh?'#10B981':'#F59E0B'}"></div></div>
      <span class="kecil">${pasang}/${target} JP</span>
    </div>`;
  }).join('') || '<p class="kecil">Belum ada pelajaran untuk kelas ini — isi dulu di menu <b>📚 Daftar Pelajaran</b>, lalu kembali ke sini untuk menempatkannya ke jadwal.</p>';
  el('mapelTerpilihInfo').textContent = SK.terpilih !== null
    ? `Mapel aktif: ${SK.mapel[SK.terpilih]?.Nama||''} — klik sel jadwal untuk menempatkan`
    : 'Klik baris mapel untuk memilih, lalu klik sel jadwal. Klik sel terisi (tanpa mapel aktif) untuk mengosongkan.';
  const totTarget = SK.mapel.filter(m=>m.Nama).reduce((a,m)=>a+(Number(m.JP)||1),0);
  const totPasang = SK.jadwal.length;
  const kurang = SK.mapel.filter(m=>m.Nama && SK.jadwal.filter(j=>j.NamaMapel===m.Nama).length < (Number(m.JP)||1))
    .map(m=>`${m.Nama} ${SK.jadwal.filter(j=>j.NamaMapel===m.Nama).length}/${Number(m.JP)||1}`);
  const pesan = !totTarget ? '' : kurang.length ? `<div class="kecil">⚠️ Belum penuh: ${kurang.join(', ')}</div>` : (totPasang>totTarget ? '<div class="kecil">⚠️ Terpasang melebihi target total</div>' : '<div class="kecil">✅ Semua target JP terpenuhi</div>');
  el('totalJp').innerHTML = `Total JP terpasang: <b>${totPasang}</b> / ${totTarget}${pesan}`;
}
async function simpanMapel(i){
  const m = SK.mapel[i];
  if(!m.Nama) return;
  if(!m.idDoc) m.idDoc = SK.kelasId+'_M'+Date.now().toString(36);

function renderGrid(){
  const slots = SK.pw.Slots, hariAktif = SK.pw.HariAktif||[];
  const sisip = new Map();
  for(const x of SK.pw.Istirahat||[]){
    if(x.Mulai && x.Selesai){
      const mSel = menitKeAngka(x.Selesai);
      const idx = slots.findIndex(s=>menitKeAngka(s.Mulai) >= mSel);
      const lbl = `☕ istirahat ${x.Mulai}–${x.Selesai}`;
      if(idx>=0) sisip.set('sebelum:'+slots[idx].NoJP, lbl); else sisip.set('akhir', lbl);
    } else {
      const k = Number(x.SetelahJP);
      const idx = slots.findIndex(s=>s.NoJP===k);
      if(idx>=0 && idx<slots.length-1) sisip.set('sebelum:'+slots[idx+1].NoJP, `☕ istirahat ${x.Menit}′`);
    }
  }
  let h = '<table class="gridJadwal"><tr><th style="width:110px">JP / Waktu</th>' + HARI.map(hr=>`<th>${hr}</th>`).join('') + '</tr>';
  for(const s of slots){
    const lbl = sisip.get('sebelum:'+s.NoJP);
    if(lbl) h += `<tr><td colspan="${HARI.length+1}" class="istRowCell">${lbl}</td></tr>`;
    h += `<tr><td class="waktuCol"><b>${s.NoJP}</b><br><span style="font-size:11px;font-weight:400">${s.Mulai}–${s.Selesai}</span></td>`;
    for(const hr of HARI){
      const aktif = hariAktif.includes(hr);
      const j = SK.jadwal.find(x=>x.Hari===hr && Number(x.NoJP)===s.NoJP);
      const bent = j && j.GuruEmail && SK.semua.some(x=>x.KelasId!==SK.kelasId && x.Hari===hr && Number(x.NoJP)===s.NoJP && x.GuruEmail===j.GuruEmail);
      if(j){
        h += `<td data-hari="${hr}" data-nojp="${s.NoJP}" class="terisi ${bent?'bentrok':''}" style="background:${j.Warna||'#94A3B8'}26"><b>${esc(j.NamaMapel)}</b><span>${esc(j.GuruNama||'')}</span></td>`;
      } else if(aktif){
        h += `<td data-hari="${hr}" data-nojp="${s.NoJP}" class="kosong">＋</td>`;
      } else h += '<td class="mati">–</td>';
    }
    h += '</tr>';
  }
  const akhir = sisip.get('akhir');
  if(akhir) h += `<tr><td colspan="${HARI.length+1}" class="istRowCell">${akhir}</td></tr>`;
  return h+'</table>';
}
function renderGridPeringatan(){
  el('gridWrap').innerHTML = renderGrid();
  const konf = [];
  for(const j of SK.jadwal){
    if(!j.GuruEmail) continue;
    const b = SK.semua.find(x=>x.KelasId!==SK.kelasId && x.Hari===j.Hari && Number(x.NoJP)===Number(j.NoJP) && x.GuruEmail===j.GuruEmail);

async function pasangSel(hari, nojp){
  const m = SK.mapel[SK.terpilih]; if(!m) return;
  if(!m.Nama){ toast('⚠️ Pilih dulu nama mapelnya sebelum menempatkan'); return; }
  const target = Number(m.JP)||1;
  const sudah = SK.jadwal.filter(j=>j.NamaMapel===m.Nama).length;
  const selIni = SK.jadwal.find(x=>x.Hari===hari && Number(x.NoJP)===nojp);
  if(selIni && selIni.NamaMapel === m.Nama) return;
  if(sudah >= target){ toast(`⚠️ Target JP ${m.Nama} sudah terpenuhi (${sudah}/${target}) — naikkan angka JP pada baris mapel bila memang perlu lebih`); return; }
  if(m.GuruEmail){
    const b = SK.semua.find(x=>x.KelasId!==SK.kelasId && x.Hari===hari && Number(x.NoJP)===nojp && x.GuruEmail===m.GuruEmail);
    if(b){ toast(`⛔ ${namaGuru(m.GuruEmail)||'Guru'} sudah mengajar di ${b.NamaKelas||'kelas lain'} pada ${hari} JP ${nojp}`); return; }
  }
  const sl = SK.pw.Slots.find(s=>s.NoJP===nojp);
  const data = {SekolahId:AKUN.SekolahId, KelasId:SK.kelasId, NamaKelas:SK.kelas?SK.kelas.NamaKelas:'', Hari:hari, NoJP:nojp, Waktu:sl?`${sl.Mulai}–${sl.Selesai}`:'', NamaMapel:m.Nama, Warna:m.Warna||'#94A3B8', GuruEmail:m.GuruEmail||'', GuruNama:namaGuru(m.GuruEmail), Status:'draf', TahunAjaran:SEKOLAH.TahunAjaran||''};
  await setDoc(doc(db,'jadwal',`${SK.kelasId}_${hari}_${nojp}`), data);
  SK.jadwal = SK.jadwal.filter(x=>!(x.Hari===hari && Number(x.NoJP)===nojp));
  SK.jadwal.push({idDoc:`${SK.kelasId}_${hari}_${nojp}`, ...data});
  segarkanSemua();
  renderMapel(); renderGridPeringatan();
}
async function kosongkanSel(hari, nojp){

/* ---------- jadwal ujian (UTS/UAS) ---------- */
let UJ = {jenis:'UTS', semester:'Ganjil', kelasId:'', kelas:null, daftarKelas:[], mapel:[], ujian:[], semua:[], pw:null, uj:null, slotsUjian:[], minggu:'', terpilih:null, pending:null, ruang:''};
const UJ_DEFAULT = {JamMulai:'07:30', DurasiUjian:90, SesiUjian:2, IstirahatUjian:[{SetelahSesi:1,Menit:30}]};
function ujSenin(d){ const dt = new Date(d); const selisih = (dt.getDay()+6)%7; return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()-selisih); }
function ujTampil(tgl, mulai, selesai){
  const t = new Date(tgl+'T00:00:00');
  return t.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'})+' · '+mulai+'–'+selesai;
}
function hitungSlotUjian(u){
  const dur = Math.max(30, Math.min(240, Number(u.DurasiUjian)||90));
  const n = Math.max(1, Math.min(6, Number(u.SesiUjian)||2));
  const rel = new Map((u.IstirahatUjian||[]).map(x=>[Number(x.SetelahSesi), Number(x.Menit)||0]));
  let t = menitKeAngka(u.JamMulai||'07:30');
  const hasil = [];
  for(let i=1;i<=n;i++){
    hasil.push({NoJP:i, Mulai:angkaKeMenit(t), Selesai:angkaKeMenit(t+dur)});
    t += dur;
    t += rel.get(i)||0;
  }
  return hasil;
}
async function modUjian(isi){
  const kelas = await ambilKelas();
  if(!kelas.length){ isi.innerHTML = '<div class="kartu"><p>Belum ada kelas. Tambahkan dulu di menu <b>Daftar Kelas &amp; Pelajaran</b>.</p></div>'; return; }
  UJ.daftarKelas = kelas;
  if(!UJ.jenis) UJ.jenis = (new Date().getMonth()+1) >= 7 ? 'UTS' : 'UAS';
  UJ.semester = UJ.jenis==='UTS' ? 'Ganjil' : 'Genap';
  UJ.terpilih = null; UJ.pending = null; UJ.minggu = '';
  isi.innerHTML = `<div class="kartu barisAtas">
      <label style="margin:0">Ujian <select id="ujJenis" style="width:auto">
        <option value="UTS"${UJ.jenis==='UTS'?' selected':''}>UTS — Ujian Tengah Semester (Ganjil)</option>
        <option value="UAS"${UJ.jenis==='UAS'?' selected':''}>UAS — Ujian Akhir Semester (Genap)</option>
      </select></label>
      <label style="margin:0">Kelas <select id="ujKelas" style="width:auto">${kelas.map(k=>`<option value="${k.id}">${esc(k.NamaKelas)}</option>`).join('')}</select></label>
    </div>
    <div id="ujPanel"></div>`;
  el('ujJenis').onchange = e=>{
    UJ.jenis = e.target.value;
    UJ.semester = UJ.jenis==='UTS' ? 'Ganjil' : 'Genap';
    UJ.minggu = ''; UJ.terpilih = null; UJ.pending = null;
    bukaUjian(el('ujKelas').value);
  };
  el('ujKelas').onchange = e=>{ UJ.minggu = ''; UJ.terpilih = null; UJ.pending = null; bukaUjian(e.target.value); };
  await bukaUjian(kelas[0].id);
}
async function bukaUjian(kelasId){
  UJ.kelasId = kelasId;
  UJ.kelas = UJ.daftarKelas.find(k=>k.id===kelasId)||{NamaKelas:''};
  const [mpS, jS, smS, pwS] = await Promise.all([
    getDocs(query(collection(db,'mapel_kelas'), where('SekolahId','==',AKUN.SekolahId), where('KelasId','==',kelasId))),
    getDocs(query(collection(db,'jadwal_ujian'), where('SekolahId','==',AKUN.SekolahId), where('KelasId','==',kelasId))),
    getDocs(query(collection(db,'jadwal_ujian'), where('SekolahId','==',AKUN.SekolahId))),
    getDoc(doc(db,'pengaturan_waktu',kelasId))
  ]);
  UJ.mapel = mpS.docs.map(d=>({idDoc:d.id,...d.data()})).sort((a,b)=>(a.Urutan||0)-(b.Urutan||0));
  UJ.ujian = jS.docs.map(d=>({idDoc:d.id,...d.data()}));
  UJ.semua = smS.docs.map(d=>d.data());
  const pwData = pwS.exists() ? pwS.data() : {};
  UJ.pw = {...PW_DEFAULT, ...pwData};
  UJ.uj = {...UJ_DEFAULT, ...(pwData.Ujian||{})};
  UJ.slotsUjian = hitungSlotUjian(UJ.uj);
  if(!UJ.minggu){
    const ada = UJ.ujian.filter(u=>u.Jenis===UJ.jenis && u.Semester===UJ.semester).map(u=>u.Tanggal).filter(Boolean).sort()[0];
    UJ.minggu = ada ? ijIso(ujSenin(new Date(ada+'T00:00:00'))) : ijIso(ujSenin(new Date()));
  }
  renderUjian();
}

      } else h += '<td class="mati">–</td>';
    }
    h += '</tr>';

  return h+'</table>';

          const pas = aktif.find(x=>x.NamaMapel===m.Nama);
          return `<option value="${i}" ${UJ.terpilih===i?'selected':''} ${pas?'disabled':''}>${esc(m.Nama)}${pas?' — 📌 '+esc(pas.Tanggal||'')+' '+esc(pas.JamMulai||''):''}</option>`;
        }).join('')}
      </select>
      <select id="ujPengawas" style="width:auto;min-width:150px">
        <option value="">— tanpa pengawas —</option>

      </select>
      <input type="text" id="ujRuang" placeholder="Ruangan ujian…" title="Ruangan tempat ujian berlangsung (tampil di jadwal guru)" style="width:auto;min-width:130px" value="${esc(UJ.ruang||'')}">
      <span id="ujSlot" class="kecil" style="flex:1.4;min-width:170px">${UJ.pending ? '📍 '+esc(UJ.pending.tampil) : '📍 Klik sel jadwal untuk menentukan waktu'}</span>
      <button type="button" id="ujSimpan" class="btn utama">💾 Simpan</button>
    </div>
    <div class="barisAtas">
      <button type="button" id="ujMggKiri" class="btn kecil" title="Minggu sebelumnya">◀</button>
      <label style="margin:0;max-width:220px">Minggu ujian<input type="date" id="ujMinggu" value="${UJ.minggu}"></label>
      <button type="button" id="ujMggKanan" class="btn kecil" title="Minggu berikutnya">▶</button>
      <span class="kecil">Tampil: ${fmtPendek(senTampil)} – ${fmtPendek(sabTampil)}</span>
    </div>
    <div id="ujMggChips" style="margin:4px 0 8px"></div>
    <div class="totalJp">Terjadwal: <b>${aktif.length}</b> / ${totalMapel} pelajaran${belumPasang.length ? ' — ⚠️ belum: '+belumPasang.map(m=>esc(m.Nama)).join(', ') : ' — ✅ semua pelajaran sudah terjadwal'}</div>
    <div id="ujGridWrap"></div>
    <div id="ujPeringatan" class="peringatan" hidden></div>
  </div>
  <div class="kartu"><h3>📋 Ujian terbit — ${UJ.jenis} ${UJ.semester}</h3>
    <div id="ujDaftar"></div>
    <div class="barisTombol">
      <button type="button" id="ujCetak" class="btn utama">🖨️ Cetak</button>
      <button type="button" id="ujHapus" class="btn bahaya">🗑 Hapus ${UJ.jenis} ${UJ.semester} kelas ini</button>
    </div>
  </div>`;
  const renderUwIst = ()=>{
    const n = Math.max(1, Math.min(6, Number(el('uwSesi').value)||2));
    const ist = UJ.uj.IstirahatUjian||[];
    el('uwIst').innerHTML = Array.from({length:n-1},(_,i)=>{
      const k = i+1;
      const cari = ist.find(x=>Number(x.SetelahSesi)===k);
      const menit = cari && cari.Menit != null ? cari.Menit : 30;
      return `<div class="istBaris"><span class="kecil">Setelah sesi ke-${k}:</span><input type="number" data-sesi="${k}" min="0" max="120" step="5" value="${menit}" style="width:80px"><span class="kecil">menit</span></div>`;
    }).join('') || '<span class="kecil">Hanya 1 sesi — tidak ada istirahat antar sesi.</span>';
  };
  renderUwIst();
  el('uwSesi').onchange = renderUwIst;
  el('uwSimpan').onclick = async ()=>{
    const n = Math.max(1, Math.min(6, Number(el('uwSesi').value)||2));
    const ist = [];
    for(let k=1;k<n;k++){
      const inp = el('uwIst').querySelector(`input[data-sesi="${k}"]`);
      ist.push({SetelahSesi:k, Menit:Math.max(0, Number(inp&&inp.value)||0)});
    }
    UJ.uj = {JamMulai:el('uwMulai').value||'07:30', DurasiUjian:Math.max(30, Math.min(240, Number(el('uwDurasi').value)||90)), SesiUjian:n, IstirahatUjian:ist};
    try{
      await setDoc(doc(db,'pengaturan_waktu',UJ.kelasId), {Ujian:UJ.uj}, {merge:true});
      toast('✅ Pengaturan waktu ujian tersimpan — grid diperbarui');
      UJ.slotsUjian = hitungSlotUjian(UJ.uj);
      renderUjian();
    }catch(err){ toast('⛔ '+teksErr(err)); }
  };
  el('ujGridWrap').innerHTML = renderGridUjian(aktif);
  el('ujMggChips').innerHTML = '📅 Minggu terisi: ' + mingguSemua.map(w=>{
    const d = new Date(w+'T00:00:00');
    const ak = new Date(d); ak.setDate(d.getDate()+5);
    const n = aktif.filter(u=>u.Tanggal && ijIso(ujSenin(new Date(u.Tanggal+'T00:00:00')))===w).length;
    return `<button type="button" class="chipHari${w===UJ.minggu?' on':''}" data-mgg="${w}">${fmtPendek(d)}–${fmtPendek(ak)}${n?' ('+n+')':''}</button>`;
  }).join('');
  el('ujDaftar').innerHTML = aktif.length ? `<table class="tabelMini"><tr><th>Hari / Tanggal</th><th>Waktu</th><th>Pelajaran</th><th>Pengawas</th><th></th></tr>${aktif.map(u=>{
    const t = u.Tanggal ? new Date(u.Tanggal+'T00:00:00') : null;
    const tglStr = t ? t.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
    return `<tr><td>${esc(tglStr)}</td><td>${esc(u.JamMulai||'')}–${esc(u.JamSelesai||'')}</td><td><b style="color:${u.Warna||'inherit'}">${esc(u.NamaMapel||'')}</b></td><td>${esc(u.PengawasNama||'—')}</td><td><button class="btnIkon" data-hapus-uj="${u.idDoc}" title="Hapus ujian ini">🗑</button></td></tr>`;
  }).join('')}</table>` : '<p class="kecil">Belum ada ujian terbit untuk jenis &amp; semester ini.</p>';
  el('ujMapel').onchange = e=>{ const v = e.target.value; UJ.terpilih = v===''?null:Number(v); if(UJ.pending) UJ.pending.mapelIdx = UJ.terpilih; renderUjian(); };
  el('ujPengawas').onchange = e=>{ if(UJ.pending) UJ.pending.PengawasEmail = e.target.value; };
  el('ujRuang').oninput = e=>{ UJ.ruang = e.target.value; };
  el('ujMinggu').onchange = e=>{ UJ.minggu = ijIso(ujSenin(new Date(e.target.value+'T00:00:00'))); renderUjian(); };
  const geserMgg = n=>{
    const d = new Date(UJ.minggu+'T00:00:00');
    d.setDate(d.getDate()+n*7);
    UJ.minggu = ijIso(ujSenin(d));
    renderUjian();
  };
  el('ujMggKiri').onclick = ()=>geserMgg(-1);
  el('ujMggKanan').onclick = ()=>geserMgg(1);
  el('ujMggChips').onclick = e=>{ const c = e.target.closest('[data-mgg]'); if(c){ UJ.minggu = c.dataset.mgg; renderUjian(); } };
  el('ujSimpan').onclick = simpanUjian;
  el('ujCetak').onclick = cetakUjian;
  el('ujHapus').onclick = hapusUjian;
  const wrap = el('ujGridWrap');
  wrap.onclick = e=>{
    const c = e.target.closest('td[data-tgl]'); if(!c) return;
    klikSelUjian(c.dataset.tgl, c.dataset.mulai, c.dataset.selesai);
  };
  wrap.ondragstart = e=>{
    const c = e.target.closest('td[data-id]'); if(!c) return;
    e.dataTransfer.setData('text/plain', c.dataset.id);
    e.dataTransfer.effectAllowed = 'move';
    UJ.seret = c.dataset.id;
  };
  wrap.ondragover = e=>{
    const c = e.target.closest('td[data-tgl]');
    if(!c || !UJ.seret || !c.dataset.mulai) return;
    const terisi = UJ.ujian.find(x=>x.Jenis===UJ.jenis && x.Semester===UJ.semester && x.Tanggal===c.dataset.tgl && x.JamMulai===c.dataset.mulai && x.idDoc!==UJ.seret);
    const adaPending = UJ.pending && UJ.pending.Tanggal===c.dataset.tgl && UJ.pending.JamMulai===c.dataset.mulai;
    if(terisi || adaPending) return;
    e.preventDefault();
    c.classList.add('sorotSeret');
  };
  wrap.ondragleave = e=>{
    const c = e.target.closest('td[data-tgl]');
    if(c) c.classList.remove('sorotSeret');
  };
  wrap.ondrop = e=>{
    e.preventDefault();
    const c = e.target.closest('td[data-tgl]');
    document.querySelectorAll('.sorotSeret').forEach(x=>x.classList.remove('sorotSeret'));
    if(!c || !UJ.seret) return;
    const id = UJ.seret; UJ.seret = null;
    pindahUjian(id, c.dataset.tgl, c.dataset.mulai, c.dataset.selesai);
  };
  wrap.ondragend = ()=>{
    UJ.seret = null;
    document.querySelectorAll('.sorotSeret').forEach(x=>x.classList.remove('sorotSeret'));
  };
  el('ujDaftar').onclick = async e=>{
    const h = e.target.closest('[data-hapus-uj]'); if(!h) return;
    try{ await deleteDoc(doc(db,'jadwal_ujian',h.dataset.hapusUj)); toast('🗑 Ujian dihapus'); await bukaUjian(UJ.kelasId); }
    catch(err){ toast('⛔ '+teksErr(err)); }
  };
  cekBentrokUjian();
}
function klikSelUjian(tgl, mulai, selesai){
  const u = UJ.ujian.find(x=>x.Jenis===UJ.jenis && x.Semester===UJ.semester && x.Tanggal===tgl && x.JamMulai===mulai);
  if(UJ.terpilih===null){
    if(u){ deleteDoc(doc(db,'jadwal_ujian',u.idDoc)).then(()=>{ toast('🗑 '+u.NamaMapel+' dihapus dari jadwal ujian'); bukaUjian(UJ.kelasId); }).catch(err=>toast('⛔ '+teksErr(err))); }
    else toast('⚠️ Pilih dulu pelajaran dari dropdown');
    return;
  }
  if(UJ.pending && UJ.pending.Tanggal===tgl && UJ.pending.JamMulai===mulai){ UJ.pending = null; renderUjian(); return; }
  if(u && u.NamaMapel !== (UJ.mapel[UJ.terpilih]||{}).Nama){
    toast(`⚠️ Slot ini sudah dipakai ${u.NamaMapel} — klik slotnya tanpa memilih pelajaran untuk menghapusnya dulu`);
    return;
  }
  UJ.pending = {mapelIdx:UJ.terpilih, Tanggal:tgl, JamMulai:mulai, JamSelesai:selesai, PengawasEmail:(el('ujPengawas')?el('ujPengawas').value:''), tampil:ujTampil(tgl,mulai,selesai)};
  renderUjian();
}
async function pindahUjian(id, tgl, mulai, selesai){
  const u = UJ.ujian.find(x=>x.idDoc===id);
  if(!u) return;
  if(u.Tanggal===tgl && u.JamMulai===mulai){ toast('ℹ️ Sudah berada di slot itu'); return; }
  const terisi = UJ.ujian.find(x=>x.Jenis===UJ.jenis && x.Semester===UJ.semester && x.Tanggal===tgl && x.JamMulai===mulai && x.idDoc!==id);
  if(terisi){ toast('⚠️ Slot sudah dipakai '+terisi.NamaMapel+' — hapus atau seret pelajaran itu dulu'); return; }
  if(UJ.pending && UJ.pending.Tanggal===tgl && UJ.pending.JamMulai===mulai){ toast('⚠️ Ada penempatan menunggu simpan di slot itu — simpan atau klik slotnya untuk membatalkan dulu'); return; }
  if(u.PengawasEmail){
    const b = UJ.semua.find(x=>x.KelasId!==u.KelasId && x.PengawasEmail===u.PengawasEmail && x.Tanggal===tgl && x.JamMulai===mulai);
    if(b){ toast('⛔ '+(namaGuru(u.PengawasEmail)||'Pengawas')+' sudah mengawas '+(b.NamaMapel||'')+' kelas '+(b.NamaKelas||'lain')+' pada slot ini'); return; }
  }
  try{
    await updateDoc(doc(db,'jadwal_ujian',id), {Tanggal:tgl, JamMulai:mulai, JamSelesai:selesai});
    toast('✅ '+(u.NamaMapel||'Ujian')+' dipindah');
    await bukaUjian(UJ.kelasId);
  }catch(err){ toast('⛔ '+teksErr(err)); }
}
async function simpanUjian(){
  if(UJ.terpilih===null || !UJ.mapel[UJ.terpilih]){ toast('⚠️ Pilih pelajarannya dulu'); return; }
  if(!UJ.pending || !UJ.pending.Tanggal){ toast('⚠️ Klik dulu sel jadwal untuk menentukan tanggal & jam'); return; }
  const m = UJ.mapel[UJ.terpilih];
  const sudah = UJ.ujian.find(x=>x.Jenis===UJ.jenis && x.Semester===UJ.semester && x.NamaMapel===m.Nama);
  if(sudah){ toast('⚠️ '+m.Nama+' sudah terjadwal ('+(sudah.Tanggal||'')+' '+(sudah.JamMulai||'')+') — hapus selnya di grid atau seret untuk memindah'); return; }
  const b = el('ujSimpan'); b.disabled = true;
  try{
    await setDoc(doc(db,'jadwal_ujian', `${UJ.kelasId}_${UJ.jenis}_${UJ.semester}_${m.idDoc}`), {SekolahId:AKUN.SekolahId, KelasId:UJ.kelasId, NamaKelas:UJ.kelas?UJ.kelas.NamaKelas:'', Jenis:UJ.jenis, Semester:UJ.semester, TahunAjaran:SEKOLAH.TahunAjaran||'', NamaMapel:m.Nama, Warna:m.Warna||'#94A3B8', Tanggal:UJ.pending.Tanggal, JamMulai:UJ.pending.JamMulai, JamSelesai:UJ.pending.JamSelesai, PengawasEmail:UJ.pending.PengawasEmail||'', PengawasNama:namaGuru(UJ.pending.PengawasEmail), Ruangan:UJ.ruang||'', Status:'terbit', DibuatPada:serverTimestamp()});
    toast('✅ '+m.Nama+' tersimpan — terlihat di Mode Wali');
    UJ.pending = null; UJ.terpilih = null;
    await bukaUjian(UJ.kelasId);
  }catch(err){ toast('⛔ '+teksErr(err)); }
  finally{ b.disabled = false; }
}
function cekBentrokUjian(){
  const w = el('ujPeringatan'); if(!w) return;
  const konf = [];
  const daftar = UJ.ujian.filter(u=>u.Jenis===UJ.jenis && u.Semester===UJ.semester);
  if(UJ.pending && UJ.terpilih!==null) daftar.push({NamaMapel:(UJ.mapel[UJ.terpilih]||{}).Nama, PengawasEmail:UJ.pending.PengawasEmail, Tanggal:UJ.pending.Tanggal, JamMulai:UJ.pending.JamMulai, KelasId:UJ.kelasId, NamaKelas:UJ.kelas?UJ.kelas.NamaKelas:''});
  for(const u of daftar){
    if(!u.PengawasEmail || !u.Tanggal || !u.JamMulai) continue;
    const b = UJ.semua.find(x=>x.KelasId!==u.KelasId && x.PengawasEmail===u.PengawasEmail && x.Tanggal===u.Tanggal && x.JamMulai===u.JamMulai);
    if(b) konf.push(`${namaGuru(u.PengawasEmail)||u.PengawasEmail}: ${u.NamaMapel||''} — sama dengan ${b.NamaMapel||''} kelas ${b.NamaKelas||'lain'} pada ${u.Tanggal} jam ${u.JamMulai}`);
  }
  w.hidden = !konf.length;
  w.innerHTML = konf.length ? '<b>⚠️ Bentrok pengawas antar kelas:</b><ul>'+konf.map(k=>`<li>${esc(k)}</li>`).join('')+'</ul>' : '';
}
async function hapusUjian(){
  const lanjut = await konfirmasi(`Hapus seluruh jadwal ${UJ.jenis} ${UJ.semester} kelas ${UJ.kelas?UJ.kelas.NamaKelas:''}?`);
  if(!lanjut) return;
  try{
    for(const u of UJ.ujian.filter(u=>u.Jenis===UJ.jenis && u.Semester===UJ.semester)){ await deleteDoc(doc(db,'jadwal_ujian',u.idDoc)); }
    toast('✅ Jadwal ujian dihapus');
    await bukaUjian(UJ.kelasId);
  }catch(err){ toast('⛔ '+teksErr(err)); }
}
function cetakUjian(){
  const rows = UJ.ujian.filter(u=>u.Jenis===UJ.jenis && u.Semester===UJ.semester).sort((a,b)=>(a.Tanggal||'').localeCompare(b.Tanggal||'')||(a.JamMulai||'').localeCompare(b.JamMulai||''));
  if(!rows.length){ toast('⚠️ Belum ada sesi tersimpan untuk dicetak'); return; }
  let h = '<table class="tabelMini"><tr><th>No</th><th>Hari / Tanggal</th><th>Waktu</th><th>Mata Pelajaran</th><th>Pengawas</th></tr>';
  rows.forEach((u,i)=>{
    const t = u.Tanggal ? new Date(u.Tanggal+'T00:00:00') : null;
    const tglStr = t ? t.toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '';
    h += `<tr><td>${i+1}</td><td>${esc(tglStr)}</td><td>${esc(u.JamMulai||'')}–${esc(u.JamSelesai||'')}</td><td><b>${esc(u.NamaMapel||'')}</b></td><td>${esc(u.PengawasNama||'')}</td></tr>`;
  });
  cetakJadwal(`Jadwal ${UJ.jenis} Semester ${UJ.semester} — Kelas ${UJ.kelas?UJ.kelas.NamaKelas:''}`, h+'</table>', 'Kepala Sekolah', namaKs());
}

/* ---------- persetujuan (KS) ---------- */
async function modUsulan(isi){
  const s = await getDocs(query(collection(db,'usulan'), where('SekolahId','==',AKUN.SekolahId)));
  const daftar = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.NamaKelas||'').localeCompare(b.NamaKelas||''));
  let html = '<h1 class="judul">📋 Persetujuan Usulan Jadwal</h1>';
  if(!daftar.length) html += '<div class="kartu"><p>Belum ada usulan jadwal dari operator.</p></div>';
  for(const u of daftar){
    const jadwal = await getDocs(query(collection(db,'jadwal'), where('SekolahId','==',AKUN.SekolahId), where('KelasId','==',u.KelasId)));
    const cells = jadwal.docs.map(d=>d.data());
    html += `<div class="kartu">
      <h3>Kelas ${esc(u.NamaKelas||'')} ${chipStatus(u.Status)}</h3>
      ${u.Catatan ? `<p class="kecil">Catatan: ${esc(u.Catatan)}</p>` : ''}
      <div>${(u.Ringkasan||[]).map(r=>`<span class="chipMapel">${esc(r.Mapel)}: ${r.Terpasang}/${r.Target} JP</span>`).join('')}</div>
      ${await gridStatis(u.KelasId, cells)}
      ${(u.Status==='menunggu'||u.Status==='revisi') ? `<div class="barisTombol">
        <button class="btn sukses" data-aksi="setuju" data-id="${u.id}">👍 Setujui</button>
        <button class="btn" data-aksi="revisi" data-id="${u.id}">✏️ Minta Revisi</button>
        <button class="btn bahaya" data-aksi="tolak" data-id="${u.id}">❌ Tolak</button></div>` : ''}
    </div>`;
  }
  isi.innerHTML = html;
  isi.onclick = async e=>{
    const b = e.target.closest('[data-aksi]'); if(!b) return;
    const id = b.dataset.id, aksi = b.dataset.aksi;
    try{
      if(aksi === 'setuju'){
        await updateDoc(doc(db,'usulan',id), {Status:'disetujui', Catatan:'', DiputuskanOleh:AKUN.NamaPengguna, DiputuskanPada:serverTimestamp()});
        toast('✅ Disetujui — operator kini dapat menerbitkan');
        modUsulan(isi);
      } else {
        modalCatatan(aksi==='tolak' ? 'Alasan penolakan' : 'Catatan revisi', async catatan=>{
          try{
            await updateDoc(doc(db,'usulan',id), {Status:aksi==='tolak'?'ditolak':'revisi', Catatan:catatan, DiputuskanOleh:AKUN.NamaPengguna, DiputuskanPada:serverTimestamp()});
            toast(aksi==='tolak' ? '❌ Usulan ditolak' : '✏️ Revisi diminta');
            modUsulan(isi);
          }catch(err){ toast('⛔ '+teksErr(err)); }
        });
      }
    }catch(err){ toast('⛔ '+teksErr(err)); }
  };
}

async function modLaporan(isi){
  const kelas = await ambilKelas();
  if(!kelas.length){ isi.innerHTML = '<h1 class="judul">📄 Laporan</h1><div class="kartu">Belum ada kelas.</div>'; return; }
  isi.innerHTML = `<h1 class="judul">📄 Laporan & Cetak Jadwal</h1>

      <button id="lapCetak" class="btn utama">🖨️ Cetak</button>
      <button id="lapCsv" class="btn">📊 Unduh CSV</button>

    const kid = el('lapKelas').value;

    const chips = mp.docs.map(d=>d.data()).map(m=>`<span class="chipMapel">${esc(m.Nama)}: ${cells.filter(c=>c.NamaMapel===m.Nama).length}/${Number(m.JP)||1} JP</span>`).join('');
    el('lapTabel').innerHTML = `<h3>Jadwal Kelas ${esc(k?k.NamaKelas:'')}</h3>

    const daftar = s.docs.map(d=>d.data()).sort((a,b)=>((b.DibuatPada?.seconds)||0)-((a.DibuatPada?.seconds)||0));

/* ---------- jadwal saya (guru) ---------- */
async function modJadwalSaya(isi){
  const s = await getDocs(query(collection(db,'jadwal'), where('GuruEmail','==',AKUN.Email), where('Status','==','disetujui')));
  const cells = s.docs.map(d=>d.data());
  const hd = new Date().getDay();
  const hariIni = hd===0 ? null : HARI[hd-1];
  if(!cells.length){
    isi.innerHTML = `<h1 class="judul">📅 Jadwal Mengajar Saya</h1>
      <div class="kartu"><p class="kecil">Belum ada jadwal yang disetujui untuk Anda. Tunggu operator menerbitkan.</p></div>`;
    return;
  }
  // ringkasan pembagian tugas: mapel yang diampu
  const perMapel = {};
  cells.forEach(c=>{
    const k = c.NamaMapel || '—';
    const r = perMapel[k] = perMapel[k] || {warna:c.Warna||'#94A3B8', kelas:new Set(), jp:0};
    r.kelas.add(c.NamaKelas||''); r.jp++;
  });
  const ampu = Object.entries(perMapel).sort((a,b)=>a[0].localeCompare(b[0]));
  // pengaturan waktu mengikuti kelas yang paling sering diajar guru ini
  const hitung = {};
  cells.forEach(c=>{ hitung[c.KelasId] = (hitung[c.KelasId]||0)+1; });
  const pwKelas = Object.keys(hitung).sort((a,b)=>hitung[b]-hitung[a])[0];
  isi.innerHTML = `<h1 class="judul">📅 Jadwal Mengajar Saya</h1>
    <div class="kartu"><h3>📚 Mata Pelajaran yang Saya Ampu</h3>
      <table class="tabelMini"><tr><th>No</th><th>Mata Pelajaran</th><th>Kelas</th><th>JP / Minggu</th></tr>
        ${ampu.map(([nama,r],i)=>`<tr><td>${i+1}</td><td><b style="color:${r.warna}">${esc(nama)}</b></td><td>${[...r.kelas].sort().join(', ')}</td><td><b>${r.jp}</b></td></tr>`).join('')}
      </table>
      <p class="kecil">Total beban mengajar: <b>${cells.length} JP/minggu</b> di ${new Set(cells.map(c=>c.KelasId)).size} kelas.</p>
    </div>
    <div class="kartu">
      <div class="barisAtas">
        <span>Total <b>${cells.length}</b> JP/minggu</span>
        <label style="margin:0;display:flex;align-items:center;gap:6px"><input type="checkbox" id="jsSorot" style="width:auto" checked> ⭐ Sorot hari ini</label>
        <button id="jsCetak" class="btn utama">🖨️ Cetak</button>
      </div>
      <p class="kecil">${hariIni ? 'Kolom '+hariIni+' disorot. ' : 'Hari ini Minggu — libur. '}Hanya jam mengajar Anda yang terisi — sel kosong berarti Anda tidak mengajar pada jam tersebut.</p>
      <div id="jsGrid"></div>
    </div>`;
  const tampil = async ()=>{
    const sorot = (el('jsSorot').checked && hariIni) ? hariIni : null;
    el('jsGrid').innerHTML = await gridStatis(pwKelas, cells, sorot, true);
  };
  el('jsSorot').onchange = tampil;
  el('jsCetak').onclick = async ()=>{
    cetakJadwal('Jadwal Mengajar — '+(AKUN.NamaPengguna||''), await gridStatis(pwKelas, cells, null, true), 'Kepala Sekolah', namaKs());
  };
  await tampil();
}

function gbUrlFoto(url){
  const s = String(url||'').trim();
  if(!s) return '';
  if(s.startsWith('data:image')) return s;
  let fileId = '';
  const m1 = s.match(/\/d\/([-\w]{25,})/);
  const m2 = s.match(/[?&]id=([-\w]{25,})/);
  if(m1) fileId = m1[1]; else if(m2) fileId = m2[1]; else return s;
  return 'https://drive.google.com/thumbnail?id='+fileId+'&sz=w400';
}
function gbKompresFoto(file, maksPx, kualitas){
  return new Promise((selesai, gagal)=>{
    const baca = new FileReader();
    baca.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const skala = Math.min(1, maksPx/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*skala); c.height = Math.round(img.height*skala);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        selesai(c.toDataURL('image/jpeg', kualitas));
      };
      img.onerror = gagal; img.src = ev.target.result;
    };
    baca.onerror = gagal; baca.readAsDataURL(file);
  });
}
function gbKompresBlob(file, maksPx, kualitas){
  return new Promise((selesai, gagal)=>{
    const baca = new FileReader();
    baca.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const skala = Math.min(1, maksPx/Math.max(img.width,img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*skala); c.height = Math.round(img.height*skala);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=> b?selesai(b):gagal(new Error('kompres gagal')), 'image/jpeg', kualitas);
      };
      img.onerror = gagal; img.src = ev.target.result;
    };
    baca.onerror = gagal; baca.readAsDataURL(file);
  });
}
function gdToken(){
  return new Promise(async (ok, gagal)=>{
    try{
      if(!window.google || !google.accounts || !google.accounts.oauth2){
        await new Promise((muat, gagalMuat)=>{
          const s = document.createElement('script');
          s.src = 'https://accounts.google.com/gsi/client';
          s.onload = muat; s.onerror = gagalMuat;
          document.head.appendChild(s);
        });
      }
      if(GOOGLE.token && Date.now() < GOOGLE.tokenSampai - 60000){ ok(GOOGLE.token); return; }
      const klien = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE.id,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: res=>{
          if(res && res.access_token){ GOOGLE.token = res.access_token; GOOGLE.tokenSampai = Date.now() + (res.expires_in||3600)*1000; ok(res.access_token); }
          else gagal(new Error(res && res.error ? res.error : 'izin ditolak'));
        },
        error_callback: err=>gagal(new Error(err && err.type ? err.type : 'izin gagal'))
      });
      klien.requestAccessToken();
    }catch(err){ gagal(err); }
  });
}
async function gdUnggah(blob, namaFile){
  const t = await gdToken();
  if(!GOOGLE.folderId){
    const cari = await fetch("https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("name='Arsip Sekolah' and mimeType='application/vnd.google-apps.folder' and trashed=false") + "&fields=files(id)", {headers:{Authorization:'Bearer '+t}}).then(r=>r.json());
    GOOGLE.folderId = (cari.files && cari.files[0]) ? cari.files[0].id : '';
    if(!GOOGLE.folderId){
      const buat = await fetch('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}, body:JSON.stringify({name:'Arsip Sekolah', mimeType:'application/vnd.google-apps.folder'})}).then(r=>r.json());
      GOOGLE.folderId = buat.id || '';
    }
  }
  const batas = 'gbArsip' + Date.now();
  const meta = JSON.stringify({name:namaFile, ...(GOOGLE.folderId ? {parents:[GOOGLE.folderId]} : {})});
  const badan = new Blob(['--'+batas+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+batas+'\r\nContent-Type: '+(blob.type||'image/jpeg')+'\r\n\r\n', blob, '\r\n--'+batas+'--'], {type:'multipart/related; boundary='+batas});
  const unggah = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{Authorization:'Bearer '+t}, body:badan});
  if(!unggah.ok) throw new Error('unggah gagal');
  const hasil = await unggah.json();
  await fetch('https://www.googleapis.com/drive/v3/files/'+hasil.id+'/permissions', {method:'POST', headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}, body:JSON.stringify({role:'reader', type:'anyone'})});
  return 'https://drive.google.com/uc?export=view&id=' + hasil.id;
}
async function gbGambarKeUrl(file, maksPx, kualitas){
  const blob = await gbKompresBlob(file, maksPx, kualitas);
  if(GOOGLE.id){
    try{ return await gdUnggah(blob, 'soal-' + Date.now() + '.jpg'); }
    catch(_){ toast('⚠️ Google Drive gagal — gambar disimpan di database.'); }
  }
  return await new Promise((ok, gagal)=>{
    const fr = new FileReader();
    fr.onload = ()=>ok(fr.result);
    fr.onerror = gagal;
    fr.readAsDataURL(blob);
  });
}

function gbUraiAlamat(alamatUtuh, isi){
  alamatUtuh = (alamatUtuh||'').trim();
  if(!alamatUtuh) return;
  const parts = alamatUtuh.split(',').map(s=>s.trim());
  let jalan='', dusun='', rt='', rw='', desa='', kec='', kab='', prov='', kodepos='';
  parts.forEach(p=>{
    if(/^Dusun\s+/i.test(p)) dusun = p.replace(/^Dusun\s+/i,'');
    else if(/RT\s*\d+/i.test(p)||/RW\s*\d+/i.test(p)){ const m1=p.match(/RT\s*(\d+)/i); const m2=p.match(/RW\s*(\d+)/i); if(m1) rt=m1[1]; if(m2) rw=m2[1]; }
    else if(/^(Desa|Kelurahan)\s+/i.test(p)) desa = p.replace(/^(Desa|Kelurahan)\s+/i,'');
    else if(/^Kecamatan\s+/i.test(p)) kec = p.replace(/^Kecamatan\s+/i,'');
    else if(/^(Kabupaten|Kota)\s+/i.test(p)) kab = p.replace(/^(Kabupaten|Kota)\s+/i,'');
    else if(/^Provi?nsi\s+/i.test(p)) prov = p.replace(/^Provi?nsi\s+/i,'');
    else if(/^Kode\s*Pos\s+/i.test(p)) kodepos = p.replace(/^Kode\s*Pos\s+/i,'');
    else if(/^\d{5}$/.test(p)) kodepos = p;
    else if(!jalan) jalan = p;
  });
  if(parts.length>=7){
    jalan = jalan||parts[0]; dusun = dusun||parts[1].replace(/^Dusun\s*/i,'');
    const rtrw = parts[2].split('/'); if(rtrw.length>=2){ rt = rt||rtrw[0].replace(/[^0-9-]/g,''); rw = rw||rtrw[1].replace(/[^0-9-]/g,''); }
    desa = desa||parts[3].replace(/^Desa\s*/i,''); kec = kec||parts[4].replace(/^Kecamatan\s*/i,'');
    kab = kab||parts[5].replace(/^Kabupaten\s*/i,''); prov = prov||parts[6].replace(/^Provi?nsi\s*/i,'');
    if(parts[7]) kodepos = kodepos||parts[7].replace(/[^0-9-]/g,'');
  }
  isi('gbAlamat',jalan); isi('gbDusun',dusun); isi('gbRt',rt); isi('gbRw',rw); isi('gbDesa',desa); isi('gbKecamatan',kec); isi('gbKabupaten',kab); isi('gbProvinsi',prov); isi('gbKodePos',kodepos);
}

    }
  };

  await muatBaris();
}

/* ---------- ijin & pengganti ---------- */
let IJL = [];
let IJ_MODE = 'harian';
let IJ_CELLS = [];
const IJ_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function ijIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ijTglPanjang(iso){ if(!iso) return ''; try{ return new Date(iso+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); }catch(_){ return iso; } }
function ijRentangTeks(x){
  const r = x.Rentang;
  if(!r || !r.Mulai) return '';
  return ijTglPanjang(r.Mulai) + ' s.d. ' + (r.Selesai ? ijTglPanjang(r.Selesai) : 'tanpa batas');
}
function chipJenis(x){
  if(x.JenisIjin!=='mingguan' && x.JenisIjin!=='bulanan') return '';
  return `<span class="sesiChip">${x.JenisIjin==='bulanan'?'🗓️':'📅'} <b>${x.JenisIjin}</b> — ${esc(ijRentangTeks(x))}</span>`;
}
function rentangMingguan(){
  const t = Number(el('ijBulan').value), y = Number(el('ijTahun').value);
  const m1 = Number(el('ijMgg1').value), m2 = Number(el('ijMgg2').value);
  const a = Math.min(m1,m2), b = Math.max(m1,m2);
  const akhir = new Date(y, t+1, 0).getDate();
  return {Mulai:ijIso(new Date(y, t, (a-1)*7+1)), Selesai:ijIso(new Date(y, t, Math.min(b*7, akhir)))};
}
function rentangBulanan(){
  const y = Number(el('ijTahun').value);
  const m1 = Number(el('ijBulan1').value);
  const v2 = el('ijBulan2').value;
  if(v2==='TANPA') return {Mulai:ijIso(new Date(y, m1, 1)), Selesai:''};
  const m2 = Number(v2);
  const y2 = m2 < m1 ? y+1 : y;
  return {Mulai:ijIso(new Date(y, m1, 1)), Selesai:ijIso(new Date(y2, m2+1, 0))};
}
async function guruKosong(hari, nojp, kecuali, daftarIjin){
  const sibuk = new Set();
  (daftarIjin||[]).forEach(x=>{
    if(x.Status!=='disetujui') return;
    (x.Sesi||[]).forEach(s=>{ if(s.Hari===hari && Number(s.NoJP)===Number(nojp) && s.PenggantiEmail) sibuk.add(s.PenggantiEmail); });
  });
  const j = await getDocs(query(collection(db,'jadwal'), where('SekolahId','==',AKUN.SekolahId), where('Hari','==',hari), where('NoJP','==',Number(nojp)), where('Status','==','disetujui')));
  j.docs.forEach(d=>{ const g=d.data().GuruEmail; if(g) sibuk.add(g); });
  return GURU.filter(g=>g.Peran==='guru' && (g.StatusAkun||'aktif')==='aktif' && g.EmailPengguna!==kecuali && !sibuk.has(g.EmailPengguna));
}
